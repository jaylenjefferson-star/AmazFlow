      AuthorizerId: !Ref JwtAuthorizer
  AiExecuteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /ai/execute'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  LeadsPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /leads'
      Target: !Sub integrations/${ApiIntegration}
