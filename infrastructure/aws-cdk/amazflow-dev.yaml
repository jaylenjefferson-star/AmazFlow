            agentId:agent.id,installationId:agent.installationId||null,agentType:agent.agentType||'CHROME_EXTENSION',
            name:agent.name,version:agent.version||null,capabilities:Array.isArray(agent.capabilities)?agent.capabilities:[],
            organizationId:agent.tenantId,platform:agent.platform||null,lastHeartbeatAt:agent.lastSeenAt||null,
            permissions:agent.permissions||null,
            connectionStatus:agent.status!=='active'?'revoked':(agent.lastSeenAt&&Date.now()-new Date(agent.lastSeenAt).getTime()<HEARTBEAT_GRACE_MS?'connected':'offline')
