AWSTemplateFormatVersion: '2010-09-09'
Description: AmazFlow development control plane with tenant-scoped RBAC (synthetic data only)

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Amazon Bedrock model used for bounded workflow AI steps

Resources:
  ControlPlaneTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      Tags:
        - { Key: Product, Value: AmazFlow }
        - { Key: Environment, Value: dev }
        - { Key: DataBoundary, Value: synthetic-only }

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: amazflow-dev-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          Required: false

  FrontlineGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: FRONTLINE, Description: Runs assigned workflows and views own executions, UserPoolId: !Ref UserPool, Precedence: 30 }
  ClientAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: CLIENT_ADMIN, Description: Runs tenant workflows and manages tenant operations, UserPoolId: !Ref UserPool, Precedence: 20 }
  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: SUPER_ADMIN, Description: AmazFlow-owned global configuration and tenant administration, UserPoolId: !Ref UserPool, Precedence: 10 }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: amazflow-dev-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: ['https://amazflow.com/app/', 'https://amazflow.com/console/']
      LogoutURLs: ['https://amazflow.com/app/', 'https://amazflow.com/console/']
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: amazflow-dev-398681517793
      UserPoolId: !Ref UserPool

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: amazflow-dev-control-plane
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem]
                Resource: !GetAtt ControlPlaneTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: '*'
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}

  ControlPlaneFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: amazflow-dev-control-plane
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref ControlPlaneTable
          DATA_BOUNDARY: synthetic-only
          LEAD_TO: sales@amazflow.com
          LEAD_FROM: sales@amazflow.com
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Code:
        ZipFile: |
          const {DynamoDBClient,ScanCommand,QueryCommand,PutItemCommand}=require('@aws-sdk/client-dynamodb');
          const {BedrockRuntimeClient,ConverseCommand}=require('@aws-sdk/client-bedrock-runtime');
          const {SESv2Client,SendEmailCommand}=require('@aws-sdk/client-sesv2');
          const db=new DynamoDBClient({}); const bedrock=new BedrockRuntimeClient({}); const ses=new SESv2Client({}); const table=process.env.TABLE_NAME;
          const reply=(s,b)=>({statusCode:s,headers:{'content-type':'application/json','access-control-allow-origin':'*'},body:JSON.stringify(b)});
          const auth=e=>{const c=e.requestContext?.authorizer?.jwt?.claims||{};const groups=String(c['cognito:groups']||'').split(',');const role=['SUPER_ADMIN','CLIENT_ADMIN','FRONTLINE'].find(r=>groups.includes(r));return {userId:c.sub,tenantId:c['custom:tenant_id'],role};};
          const parse=i=>JSON.parse(i.document.S); const now=()=>new Date().toISOString();
          const ai=async(step,context)=>{const allowed=Array.isArray(step.allowedValues)?step.allowedValues.map(String):[];const system='You are a bounded operations workflow component. Never choose or invent tools. Return JSON only with keys value and confidence. Confidence must be between 0 and 1.';const prompt=`Operation: ${step.operation}\nInstruction: ${step.prompt}\nAllowed values: ${allowed.length?allowed.join(', '):'not restricted'}\nContext: ${JSON.stringify(context||{})}`;const out=await bedrock.send(new ConverseCommand({modelId:process.env.BEDROCK_MODEL_ID,system:[{text:system}],messages:[{role:'user',content:[{text:prompt}]}],inferenceConfig:{maxTokens:800,temperature:0}}));let text=out.output?.message?.content?.find(x=>x.text)?.text||'{}';text=text.replace(/^```json\s*|\s*```$/g,'');const result=JSON.parse(text);if(typeof result.confidence!=='number'||result.confidence<0||result.confidence>1)throw new Error('Invalid AI confidence');if(allowed.length&&!allowed.includes(String(result.value)))throw new Error('AI returned value outside allowlist');return {result,usage:out.usage};};
          const valueAt=(obj,path)=>{const keys=String(path||'').split('.');const read=root=>keys.reduce((v,k)=>v?.[k],root);const direct=read(obj);return direct===undefined?read(obj?.values):direct;};const test=(left,op,right)=>op==='equals'?left===right:op==='notEquals'?left!==right:op==='exists'?left!==undefined:op==='gt'?left>right:op==='lt'?left<right:false;
          const scanType=async(type,a)=>{
            if(a.role==='SUPER_ADMIN'){
              // Cross-tenant SUPER_ADMIN reads still Scan: there's no cross-tenant GSI yet.
              // Accepted tradeoff at current scale -- add a GSI if the operator's own views get slow.
              const out=await db.send(new ScanCommand({TableName:table}));
              return (out.Items||[]).filter(i=>i.sk?.S?.startsWith(type)&&i.document?.S).map(parse);
            }
            const out=await db.send(new QueryCommand({TableName:table,KeyConditionExpression:'pk = :pk AND begins_with(sk, :prefix)',ExpressionAttributeValues:{':pk':{S:`TENANT#${a.tenantId}`},':prefix':{S:type}}}));
            return (out.Items||[]).filter(i=>i.document?.S).map(parse);
          };
          const save=async(type,doc)=>db.send(new PutItemCommand({TableName:table,Item:{pk:{S:`TENANT#${doc.tenantId}`},sk:{S:`${type}#${doc.id}`},tenantId:{S:doc.tenantId},document:{S:JSON.stringify(doc)},updatedAt:{S:now()}}}));
          const advance=async(workflow,run)=>{
            const audit=(type,message,stepId,details)=>run.audit.push({id:`aud_${run.audit.length+1}`,at:now(),type,message,stepId,details});
            let next=run.currentStepId;
            for(let guard=0;guard<30&&next;guard++){
              const step=workflow.steps.find(s=>s.id===next);
              if(!step) throw new Error(`Missing step ${next}`);
              audit('STEP_STARTED',step.name,step.id);
              if(step.type==='ai'){
                const out=await ai(step,{input:run.context.input,...run.context.values});
                run.context.values[step.outputKey]=out.result;
                audit('AI_COMPLETED','Amazon Bedrock returned a bounded result',step.id,{model:process.env.BEDROCK_MODEL_ID,usage:out.usage});
                next=step.next;
              } else if(step.type==='condition'){
                next=test(valueAt(run.context,step.path),step.operator,step.value)?step.whenTrue:step.whenFalse;
                audit('CONDITION_EVALUATED',`Condition routed to ${next}`,step.id);
              } else if(step.type==='approval'){
                run.status='WAITING_APPROVAL'; run.currentStepId=step.id;
                audit('APPROVAL_REQUIRED',step.message,step.id,{roles:step.roles});
                break;
              } else if(step.type==='action'){
                if(step.provider==='mock'){
                  const result={ok:true,provider:step.provider,operation:step.operation,simulated:true,status:step.input?.status||'COMPLETED'};
                  run.context.lastAction={result};
                  audit('ACTION_COMPLETED',`${step.provider} action completed`,step.id,result);
                  next=step.next;
                } else {
                  const task={id:`task_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,runId:run.id,tenantId:run.tenantId,stepId:step.id,provider:step.provider,operation:step.operation,input:step.input||{},expiresAt:new Date(Date.now()+5*60000).toISOString(),status:'PENDING'};
                  await save('TASK',task);
                  run.status='WAITING_AGENT'; run.currentStepId=step.id;
                  audit('AGENT_TASK_CREATED',`${step.provider}:${step.operation}`,step.id,{taskId:task.id});
                  break;
                }
              } else if(step.type==='verify'){
                const passed=test(valueAt(run.context,step.path),step.operator,step.value);
                audit(passed?'VERIFIED':'VERIFICATION_FAILED',passed?'Expected state verified':'Expected state not verified',step.id,{expected:step.value,actual:valueAt(run.context,step.path)});
                next=passed?step.next:step.onFailure;
              } else if(step.type==='end'){
                run.status=step.outcome==='success'?'COMPLETED':'FAILED';
                audit(run.status,step.name,step.id);
                next=undefined;
              }
              run.currentStepId=next; run.updatedAt=now();
            }
            await save('RUN',run);
            return run;
          };
          const runWorkflow=async(workflow,input,a)=>{
            const run={id:`run_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,tenantId:workflow.tenantId,workflowId:workflow.id,workflowVersion:workflow.version||1,status:'RUNNING',currentStepId:workflow.startAt,context:{input,values:{},lastAction:null},audit:[{id:'aud_1',at:now(),type:'RUN_STARTED',message:'Workflow execution started',details:{actor:a.userId,role:a.role}}],createdAt:now(),updatedAt:now()};
            return advance(workflow,run);
          };
          const resumeAgentTask=async(taskId,result,a)=>{
            const allTasks=await scanType('TASK#',{role:'SUPER_ADMIN'});
            const task=allTasks.find(t=>t.id===taskId);
            if(!task) throw {status:404,message:'Task not found'};
            if(a.role!=='SUPER_ADMIN'&&task.tenantId!==a.tenantId) throw {status:403,message:'Task belongs to another tenant'};
            if(task.status!=='PENDING') throw {status:409,message:'Task already resolved'};
            const allRuns=await scanType('RUN#',{role:'SUPER_ADMIN'});
            const run=allRuns.find(r=>r.id===task.runId);
            if(!run||run.status!=='WAITING_AGENT'||run.currentStepId!==task.stepId) throw {status:409,message:'Run is not waiting for this task'};
            const allWorkflows=await scanType('WORKFLOW#',{role:'SUPER_ADMIN'});
            const workflow=allWorkflows.find(w=>w.id===run.workflowId);
            if(!workflow) throw {status:400,message:'Workflow not found for run'};
            task.status='COMPLETED';
            await save('TASK',task);
            run.context.lastAction={result};
            run.audit.push({id:`aud_${run.audit.length+1}`,at:now(),type:'AGENT_RESULT',stepId:task.stepId,message:`Agent completed ${task.stepId}`,details:result});
            const step=workflow.steps.find(s=>s.id===task.stepId);
            run.status='RUNNING'; run.currentStepId=step.next;
            return advance(workflow,run);
          };
          const resumeApproval=async(runId,stepId,approved,a)=>{
            const allRuns=await scanType('RUN#',{role:'SUPER_ADMIN'});
            const run=allRuns.find(r=>r.id===runId);
            if(!run) throw {status:404,message:'Run not found'};
            if(a.role!=='SUPER_ADMIN'&&run.tenantId!==a.tenantId) throw {status:403,message:'Run belongs to another tenant'};
            if(run.status!=='WAITING_APPROVAL'||run.currentStepId!==stepId) throw {status:409,message:'Run is not waiting for this approval'};
            const allWorkflows=await scanType('WORKFLOW#',{role:'SUPER_ADMIN'});
            const workflow=allWorkflows.find(w=>w.id===run.workflowId);
            if(!workflow) throw {status:400,message:'Workflow not found for run'};
            const step=workflow.steps.find(s=>s.id===stepId);
            if(!step||step.type!=='approval') throw {status:400,message:'Step is not an approval step'};
            run.audit.push({id:`aud_${run.audit.length+1}`,at:now(),type:approved?'APPROVED':'REJECTED',stepId,message:approved?'Approval granted':'Approval rejected',details:{by:a.userId,role:a.role}});
            run.status='RUNNING'; run.currentStepId=approved?step.next:step.onReject;
            return advance(workflow,run);
          };
          exports.handler=async e=>{try{const route=e.routeKey||'';if(route==='GET /health')return reply(200,{ok:true,service:'amazflow-control-plane',boundary:process.env.DATA_BOUNDARY,aiRuntime:'amazon-bedrock'});if(route==='POST /leads'){const b=JSON.parse(e.body||'{}');const clean=v=>String(v==null?'':v).slice(0,2000).trim();const email=clean(b.email);const name=clean(b.name);if(clean(b.website))return reply(201,{ok:true});if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return reply(400,{error:'A name and a valid work email are required'});const lead={id:`lead_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,tenantId:'amazflow',name,email,company:clean(b.company),role:clean(b.role),workflow:clean(b.workflow),volume:clean(b.volume),message:clean(b.message),source:clean(b.source)||'website',status:'new',createdAt:now()};await save('LEAD',lead);try{const text=['New AmazFlow lead','','Name: '+lead.name,'Email: '+lead.email,'Company: '+lead.company,'Role: '+lead.role,'Workflow to automate: '+lead.workflow,'Monthly volume: '+lead.volume,'Notes: '+lead.message,'','Source: '+lead.source,'Received: '+lead.createdAt,'Lead ID: '+lead.id].join('\n');await ses.send(new SendEmailCommand({FromEmailAddress:process.env.LEAD_FROM,Destination:{ToAddresses:[process.env.LEAD_TO]},ReplyToAddresses:[lead.email],Content:{Simple:{Subject:{Data:'New lead: '+lead.name+(lead.company?' - '+lead.company:'')},Body:{Text:{Data:text}}}}}));}catch(mailErr){console.error('lead email failed',mailErr.message);}return reply(201,{ok:true,id:lead.id});}const a=auth(e);if(!a.role)return reply(403,{error:'Role required'});if(route==='GET /me')return reply(200,a);if(route==='GET /workflows'){const items=await scanType('WORKFLOW#',a);return reply(200,items.sort((x,y)=>String(y.version).localeCompare(String(x.version))));}if(route==='POST /workflows'){if(a.role!=='SUPER_ADMIN')return reply(403,{error:'Only AmazFlow super admins configure workflows'});const body=JSON.parse(e.body||'{}');if(!body.id||!body.tenantId||!body.name||!body.startAt||!Array.isArray(body.steps))return reply(400,{error:'Invalid workflow definition'});body.updatedAt=now();await save('WORKFLOW',body);return reply(201,body);}if(route==='GET /leads'){if(a.role!=='SUPER_ADMIN')return reply(403,{error:'Only AmazFlow super admins view leads'});const items=await scanType('LEAD#',a);return reply(200,items.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))));}if(route==='GET /runs'){const items=await scanType('RUN#',a);return reply(200,items.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))));}if(route==='POST /workflows/{id}/runs'){const id=e.pathParameters?.id;const workflows=await scanType('WORKFLOW#',a);const workflow=workflows.find(w=>w.id===id);if(!workflow)return reply(404,{error:'Workflow not found'});const body=JSON.parse(e.body||'{}');return reply(201,await runWorkflow(workflow,body,a));}if(route==='GET /agent-tasks'){if(a.role==='FRONTLINE')return reply(403,{error:'Only tenant admins view agent tasks'});const items=await scanType('TASK#',a);return reply(200,items.filter(t=>t.status==='PENDING'));}if(route==='POST /agent-tasks/{id}/result'){if(a.role==='FRONTLINE')return reply(403,{error:'Only tenant admins resolve agent tasks'});try{const body=JSON.parse(e.body||'{}');const run=await resumeAgentTask(e.pathParameters?.id,body,a);return reply(200,run);}catch(err){if(err&&err.status)return reply(err.status,{error:err.message});throw err;}}if(route==='POST /runs/{id}/approvals/{stepId}'){if(a.role==='FRONTLINE')return reply(403,{error:'Only tenant admins decide approvals'});try{const body=JSON.parse(e.body||'{}');const run=await resumeApproval(e.pathParameters?.id,e.pathParameters?.stepId,!!body.approved,a);return reply(200,run);}catch(err){if(err&&err.status)return reply(err.status,{error:err.message});throw err;}}if(route==='POST /ai/execute'){const body=JSON.parse(e.body||'{}');const allowedOps=['classify','extract','transform','summarize','choose'];if(!allowedOps.includes(body.operation)||typeof body.prompt!=='string')return reply(400,{error:'Invalid bounded AI request'});const out=await ai(body,body.context||{});return reply(200,{model:process.env.BEDROCK_MODEL_ID,provider:'amazon-bedrock',...out});}return reply(404,{error:'Route not found'});}catch(err){console.error(err);return reply(500,{error:err.message||'Control plane error'});}};

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: amazflow-dev-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['https://amazflow.com', 'https://www.amazflow.com']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ControlPlaneFunction.Arn
      PayloadFormatVersion: '2.0'

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      Name: amazflow-cognito
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /health'
      Target: !Sub integrations/${ApiIntegration}
  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /me'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  WorkflowsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /workflows'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  WorkflowsPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /workflows'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  AiExecuteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /ai/execute'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  LeadsPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /leads'
      Target: !Sub integrations/${ApiIntegration}
  LeadsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /leads'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  RunsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /runs'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  WorkflowRunPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /workflows/{id}/runs'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  AgentTasksGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /agent-tasks'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  AgentTaskResultPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /agent-tasks/{id}/result'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  RunApprovalPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /runs/{id}/approvals/{stepId}'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ControlPlaneFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  ApiUrl: { Value: !GetAtt HttpApi.ApiEndpoint }
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  TableName: { Value: !Ref ControlPlaneTable }
  BedrockModel: { Value: !Ref BedrockModelId }
  CognitoDomain: { Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com' }
