  # GET /invitations/{token} carries NO authorizer, deliberately: the invitee has no account yet, so
  # requiring a session would make the invitation unopenable by the only person it is for. It is
  # rate-limited in the handler and returns exactly two fields. Acceptance, by contrast, keeps the JWT
  # authorizer -- the caller must be signed in as the invited address.
  TeamsDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
