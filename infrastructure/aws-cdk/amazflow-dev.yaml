          // installed, which is how every historical run in this account timed out.
          const preflightFor=async(workflow,tenantId)=>{
            const targets=[...new Set((workflow.steps||[]).filter(st=>st.type==='action').map(st=>st.provider==='desktop'||st.executionTarget==='desktop_agent'?'desktop_agent':(st.provider==='browser'?'browser_extension':null)).filter(Boolean))];
            const requiredActions={};
            for(const st of (workflow.steps||[])){
              if(st.type!=='action') continue;
              const t=executionTargetFor(st);
              if(st.provider!=='browser'&&st.provider!=='desktop') continue;
              (requiredActions[t]=requiredActions[t]||new Set()).add(st.operation);
            }
            const all=await scanType('AGENT#',{role:'SUPER_ADMIN'});
            const mine=all.filter(x=>x.tenantId===tenantId).map(agentSnapshot);
            const surfaces=targets.map(target=>{
              const wanted=AGENT_TYPE_FOR_TARGET[target];
              const candidates=mine.filter(x=>x.agentType===wanted&&x.connectionStatus!=='revoked');
              const needed=[...(requiredActions[target]||[])];
              const connected=candidates.filter(x=>x.connectionStatus==='connected');
              const capable=connected.filter(x=>!x.capabilities.length||needed.every(op=>x.capabilities.includes(op)));
              const permissioned=capable.filter(x=>target!=='desktop_agent'||!x.permissions||x.permissions.accessibility!==false);
              let status='not_installed',action='install';
              if(permissioned.length){ status='connected'; action=null; }
              else if(capable.length){ status='missing_permissions'; action='grant_permission'; }
              else if(connected.length){ status='outdated'; action='update'; }
              else if(candidates.length){ status='offline'; action=target==='desktop_agent'?'open_app':'connect'; }
              return {target,agentType:wanted,status,action,requiredActions:needed,agents:candidates};
            });
            return {workflowId:workflow.id,requiredTargets:targets,surfaces,ready:surfaces.every(x=>x.status==='connected')};
          };
          const revokeAgent=async(agentId,a)=>{
            const allAgents=await scanType('AGENT#',{role:'SUPER_ADMIN'});
            const agent=allAgents.find(x=>x.id===agentId);
            if(!agent) throw {status:404,message:'Agent not found'};
            if(a.role!=='SUPER_ADMIN'&&agent.tenantId!==a.tenantId) throw {status:403,message:'Agent belongs to another tenant'};
            agent.status='revoked'; agent.updatedAt=now();
            await save('AGENT',agent);
