AWSTemplateFormatVersion: '2010-09-09'
Description: AmazFlow control plane with tenant-scoped RBAC and bounded AI execution

Parameters:
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Amazon Bedrock model used for bounded workflow AI steps and AmazFlow Copilot
  BedrockFoundationModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-6
    Description: Foundation model granted to the Lambda role. Matches BedrockModelId for a
      directly-invokable model; differs only when BedrockModelId is a cross-region inference
      profile (e.g. us.anthropic.*), which is not entitled on this account today.
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [development, production]
  ExecutorHarnessArn:
    Type: String
    Default: arn:aws:bedrock-agentcore:us-east-1:398681517793:harness/harness_pwphl-y67Z8PxUwD
    Description: AgentCore Harness the control plane invokes as the AmazFlow Executor for agentcore-backed action steps
  DataBoundary:
    Type: String
    Default: production-non-regulated
    AllowedValues: [synthetic-only, production-non-regulated]
    Description: Production allows live operational data but not PHI, payment data, or other regulated data
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional operations notification address for the alarms below

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  ExecutionGrantSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Runtime-only HMAC secret for AgentCore execution grants
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ControlPlaneTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: CrossOrganizationIndex
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: INCLUDE, NonKeyAttributes: [document, tenantId] }
      Tags:
        - { Key: Product, Value: AmazFlow }
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: DataBoundary, Value: !Ref DataBoundary }

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: amazflow-dev-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          Required: false

  FrontlineGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: FRONTLINE, Description: Runs assigned workflows and views own executions, UserPoolId: !Ref UserPool, Precedence: 30 }
  ClientAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: CLIENT_ADMIN, Description: Runs tenant workflows and manages tenant operations, UserPoolId: !Ref UserPool, Precedence: 20 }
  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: SUPER_ADMIN, Description: AmazFlow-owned global configuration and tenant administration, UserPoolId: !Ref UserPool, Precedence: 10 }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: amazflow-dev-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      # ALLOW_USER_PASSWORD_AUTH lets the branded /login page authenticate directly against
      # Cognito's InitiateAuth API (password sent over TLS) instead of redirecting through the
      # Cognito Hosted UI -- the tradeoff for never showing AWS/Cognito branding, and for not
      # needing an SRP client-side crypto library. Not a downgrade from the (still enabled) SRP
      # flow's own security level in any way that matters over TLS; it's simply a different,
      # equally AWS-supported flow.
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      # Task 9.11 / requirement 1.1-1.3, 1.8. These change in the SAME template edit as the
      # cross-origin allowlist below and the origin echo in the handler, because the three lists have
      # to agree to work at all and there is no way to notice a disagreement from either side alone:
      # a callback URL the allowlist does not carry authenticates and then cannot call the API, and an
      # allowlisted origin with no callback URL cannot sign in. Shipping them separately means shipping
      # a broken surface in between.
      #
      # Q-9's conservative assumption: the three named origins are the intended domains. The legacy
      # `/app` and `/console` paths on amazflow.com stay listed because they stay live until task 28.4
      # (requirement 1.11) -- a person mid-session on the old surface must not be signed out by this.
      CallbackURLs:
        - 'https://app.amazflow.com/'
        - 'https://admin.amazflow.com/'
        - 'https://amazflow.com/app/'
        - 'https://amazflow.com/console/'
      LogoutURLs:
        - 'https://amazflow.com/signed-out/'
        - 'https://app.amazflow.com/'
        - 'https://admin.amazflow.com/'
        - 'https://amazflow.com/app/'
        - 'https://amazflow.com/console/'
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: amazflow-dev-398681517793
      UserPoolId: !Ref UserPool

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: amazflow-dev-control-plane
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
                Resource: !GetAtt ControlPlaneTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: '*'
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref ExecutionGrantSecret
              - Effect: Allow
                # Scoped by name prefix rather than to a specific ARN: each customer secret is created
                # at request time, so its ARN does not exist until CreateSecret runs. GetSecretValue is
                # deliberately NOT granted here -- no route ever reads a customer secret's value back
                # (requirement 20.8), so the Lambda has no need for it and does not carry it.
                Action: [secretsmanager:CreateSecret, secretsmanager:PutSecretValue, secretsmanager:DeleteSecret]
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:amazflow/customer-secret/*
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
              - Effect: Allow
                # Broad resource scope matches the pattern AgentCore itself uses for these actions
                # (no resource-level ARN restriction is currently supported for InvokeHarness) --
                # tenant/workflow/run scoping is enforced by the execution grant, not by IAM here.
                Action: [bedrock-agentcore:InvokeHarness, bedrock-agentcore:InvokeAgentRuntime]
                Resource: '*'
              - Effect: Allow
                # ListUsersInGroup isn't in the master prompt's Phase 5 list but is required to resolve
                # each Cognito user's AmazFlow role (group membership isn't returned by ListUsers itself).
                #
                # AdminCreateUser + AdminAddUserToGroup are the invite flow that AdminAddUserToGroup
                # was originally reserved for. AdminGetUser reads back the invitation state so the
                # console can show who has accepted. Deliberately NOT granted: AdminDeleteUser and
                # AdminSetUserPassword. Removing a person is done by disabling them, which is
                # reversible and leaves their audit trail attributable, and no operator route should
                # be able to set a customer's password.
                Action: [cognito-idp:ListUsers, cognito-idp:ListUsersInGroup, cognito-idp:AdminEnableUser, cognito-idp:AdminDisableUser, cognito-idp:AdminAddUserToGroup, cognito-idp:AdminRemoveUserFromGroup, cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser, cognito-idp:AdminUpdateUserAttributes, cognito-idp:AdminUserGlobalSignOut]
                Resource: !GetAtt UserPool.Arn

  ControlPlaneFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: amazflow-dev-control-plane
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref ControlPlaneTable
          USER_POOL_ID: !Ref UserPool
          DATA_BOUNDARY: !Ref DataBoundary
          # sales@amazflow.com is not a verified SES identity and the account is still in the SES
          # sandbox (verified sender AND recipient required, amazflow.com domain verification is
          # pending), so a send to/from it fails silently -- this caught every lead the form has
          # captured since the account was created. hello@amazflow.com is the one identity that's
          # actually verified. Move both back to a dedicated sales@ address once the domain
          # verifies or SES production access is granted.
          LEAD_TO: hello@amazflow.com
          LEAD_FROM: hello@amazflow.com
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EXECUTION_GRANT_SECRET_ID: !Ref ExecutionGrantSecret
          EXECUTOR_HARNESS_ARN: !Ref ExecutorHarnessArn
      Code:
        ZipFile: |
          const crypto=require('crypto');
          const {DynamoDBClient,ScanCommand,QueryCommand,PutItemCommand,GetItemCommand,DeleteItemCommand,TransactWriteItemsCommand}=require('@aws-sdk/client-dynamodb');
          const {BedrockRuntimeClient,ConverseCommand}=require('@aws-sdk/client-bedrock-runtime');
          const {SESv2Client,SendEmailCommand}=require('@aws-sdk/client-sesv2');
          const {SecretsManagerClient,GetSecretValueCommand,CreateSecretCommand,PutSecretValueCommand,DeleteSecretCommand}=require('@aws-sdk/client-secrets-manager');
          const {CognitoIdentityProviderClient,ListUsersCommand,ListUsersInGroupCommand,AdminEnableUserCommand,AdminDisableUserCommand,AdminCreateUserCommand,AdminAddUserToGroupCommand,AdminRemoveUserFromGroupCommand,AdminGetUserCommand,AdminUpdateUserAttributesCommand,AdminUserGlobalSignOutCommand}=require('@aws-sdk/client-cognito-identity-provider');
          const db=new DynamoDBClient({}); const bedrock=new BedrockRuntimeClient({}); const ses=new SESv2Client({}); const secrets=new SecretsManagerClient({}); const cognito=new CognitoIdentityProviderClient({}); const table=process.env.TABLE_NAME;
          // Requirement 27.11: successful responses fail closed through a route-specific top-level
          // allowlist. A newly persisted field is not returned until its owning route names it here.
          const privateResponseFields=new Set(['managedProfileId','agentSessionId','browserSessionId']);
          const RESPONSE_FIELD_GROUPS={
            ack:['ok','id','username','email','enabled','deleted','read','revoked','revokedInvitations','invitationId','acceptUrl','previousRole','role','coarseGroup'],
            health:['ok','service','boundary','aiRuntime'],
            me:['userId','tenantId','organizationId','organizationName','email','role','platformRole','teamIds','sections','lastLoginAt','accountStatus'],
            profile:['email','displayName','givenName','familyName','updatedAt'],
            security:['accessTokenMinutes','idTokenMinutes','refreshTokenDays','passwordPolicy','mfaEnrollmentAvailable','singleSignOnAvailable','directoryProvisioningAvailable'],
            organization:['id','tenantId','name','slug','status','plan','createdAt','updatedAt','branding','settings','primaryDomain','primaryContact','billingContact','accountOwnerUserId','crmRecordId','activatedAt','onboardingStatus','lifecycleStatus'],onboarding:['tenantId','status','crmReference','internalOwner','milestones','checklist','internalNotes','updatedAt'],
            user:['username','email','role','platformRole','teamIds','enabled','userStatus','state','membershipStatus','invitedAt','invitedBy','activatedAt','lastLoginAt','createdAt','updatedAt'],
            team:['id','tenantId','name','memberUsernames','createdAt','updatedAt','deleted'],teams:['teams','grantsPermissions','grantsPermissionsReason'],
            invitation:['organizationName','organizationId','email','role','acceptUrl','invitationId','username','enabled','userStatus','createdAt'],
            notification:['id','tenantId','audience','kind','title','body','deepLink','createdAt','read','eventId'],preferences:['username','values','updatedAt','keys'],
            // allowedProviders, dataClass, customerSummary and trigger are part of the definition the
            // builder round-trips: the draft route validates allowedProviders on save, so a response
            // that stripped it would hand back a definition failing its own validation next save.
            workflow:['id','tenantId','name','description','version','status','startAt','steps','assignedRoles','allowedProviders','dataClass','customerSummary','trigger','inputSchema','manualMinutesEstimate','createdBy','createdAt','updatedAt','publishedAt','publishedBy','unpublishedAt','archivedAt','archivedBy','duplicatedFromWorkflowId','duplicatedFromVersion','generatedFromDescription','requiredSurfaces','requiredTargets','targets','ready','checks'],
            // Preflight is a readiness report, not a workflow: `surfaces` was being stripped while
            // it borrowed the workflow contract, which is the whole answer the route exists to give.
            preflight:['workflowId','requiredTargets','surfaces','ready'],
            run:['id','tenantId','workflowId','workflowVersion','workflowName','status','currentStepId','createdBy','createdAt','startedAt','updatedAt','completedAt','input','context','audit','steps','output','error','isTest','testRun','resumedFromRunId','grant','result','usage','traceId','aiRuntimeLabel','ok','runId','stepId','recordedAt'],
            // A task an agent is offered has to carry the work: `input`, `expiresAt` and
            // `destination` are what it acts on. Without them the poll response is a list of
            // identifiers no agent can execute.
            task:['id','tenantId','runId','stepId','provider','operation','input','status','executionTarget','destination','requiredCapabilities','assignedRoles','workflowId','expiresAt','createdBy','createdAt','updatedAt','claimedBy','claimedAt','claimExpiresAt','grant','grantId','result','eligibilityReason'],
            // The claim envelope is not a task: it wraps one, plus the grant, the lease deadline,
            // the verification contract and the `display` block both agents render.
            claim:['task','grant','grantId','runId','stepId','workflowId','claimExpiresAt','verify','executionTarget','destination','display'],
            // `organizationId` comes from agentSnapshot and `lastSeenAt` is what the existing staff
            // console renders "last seen" from; omitting them reported a live agent as never connected.
            agent:['id','tenantId','organizationId','name','status','connectionStatus','agentType','capabilities','allowedDomains','platform','version','permissions','lastSeenAt','lastHeartbeatAt','createdBy','createdAt','updatedAt','code','expiresAt','installationId','agent','token','agentId','agentName','userId','userRole','ok'],
            connection:['id','tenantId','name','baseUrl','allowedOrigins','preferredMode','status','createdBy','createdAt','updatedAt','loginSessionId','expiresAt','ready','message'],
            secret:['id','tenantId','name','kind','hint','createdBy','createdAt','rotatedAt','lastUsedAt','deleted'],
            audit:['id','tenantId','at','actor','actorLabel','action','summary','details','correlationId'],ticket:['id','tenantId','subject','message','status','createdBy','createdAt','updatedAt','category','priority'],
            lead:['id','tenantId','name','email','company','role','workflow','volume','message','source','status','createdAt'],settings:['taskExpiryMs','confirmationExpiryMs','agentCodeExpiryMs','bedrockModel','aiRuntimeLabel','dataBoundary','updatedAt'],
            // Time saved is an estimate against a customer-supplied manual duration. A dollar
            // figure would imply a labor rate the platform neither stores nor verifies.
            matrix:['roles','permissions','grants'],copilot:['id','tenantId','status','messages','actions','role','content','createdAt','updatedAt','result','usage','traceId'],summary:['totalRunsCompleted','totalMinutesSaved']
          };
          const RESPONSE_FIELDS_BY_ROUTE=new Map();const allowResponseFields=(routes,group)=>{const fields=new Set(RESPONSE_FIELD_GROUPS[group]);for(const route of routes)RESPONSE_FIELDS_BY_ROUTE.set(route,fields);};
          allowResponseFields(['GET /health'],'health');
          allowResponseFields(['POST /leads','POST /me/sessions/revoke','POST /me/password-changed','POST /notifications/{id}/read','POST /notifications/read-all','POST /tenants/{tenantId}/users/{username}/sessions/revoke','POST /tenants/{tenantId}/users/{username}/status'],'ack');
          allowResponseFields(['GET /me'],'me');allowResponseFields(['GET /me/profile','PUT /me/profile'],'profile');allowResponseFields(['GET /security/facts'],'security');allowResponseFields(['GET /me/preferences','PUT /me/preferences'],'preferences');
          allowResponseFields(['GET /organizations','POST /organizations','GET /organizations/{slug}','PUT /organizations/{slug}','POST /organizations/{slug}/profile','POST /organizations/{slug}/settings','POST /organizations/{slug}/branding','GET /organizations/{slug}/branding'],'organization');allowResponseFields(['GET /onboarding','POST /onboarding/checklist/{step}','GET /organizations/{slug}/onboarding','PUT /organizations/{slug}/onboarding'],'onboarding');
          allowResponseFields(['GET /tenants/{tenantId}/users'],'user');allowResponseFields(['POST /tenants/{tenantId}/users/{username}/role','POST /tenants/{tenantId}/users/{username}/invitation/resend','DELETE /tenants/{tenantId}/users/{username}/invitation'],'ack');allowResponseFields(['POST /tenants/{tenantId}/users','GET /invitations/{token}','POST /invitations/{token}/accept'],'invitation');
          allowResponseFields(['GET /teams'],'teams');allowResponseFields(['POST /teams','PUT /teams/{id}','DELETE /teams/{id}','POST /teams/{id}/members','DELETE /teams/{id}/members/{username}'],'team');allowResponseFields(['GET /notifications'],'notification');allowResponseFields(['GET /permissions/matrix'],'matrix');
          allowResponseFields(['GET /workflows','POST /workflows','POST /workflows/generate','GET /workflows/{id}/versions','POST /workflows/{id}/draft','POST /workflows/{id}/publish','POST /workflows/{id}/unpublish','POST /workflows/{id}/duplicate','POST /workflows/{id}/archive'],'workflow');allowResponseFields(['GET /workflows/{id}/preflight'],'preflight');
          allowResponseFields(['GET /runs','POST /workflows/{id}/runs','POST /runs/{id}/cancel','POST /runs/{id}/resume','POST /runs/{id}/confirmations/{stepId}/confirm','POST /runs/{id}/approvals/{stepId}','POST /runs/{id}/executor/invoke','POST /agent-tasks/{id}/result','POST /agent/tasks/{id}/result','POST /agent/tools/record-step-result','POST /ai/execute'],'run');
          allowResponseFields(['GET /agent-tasks','GET /agent/tasks'],'task');allowResponseFields(['POST /agent/tasks/{id}/claim'],'claim');allowResponseFields(['GET /agents','POST /agent-authorizations','POST /agent-authorizations/{code}/exchange','POST /agents/{id}/revoke','POST /agent/heartbeat'],'agent');
          allowResponseFields(['GET /connections/browser','POST /connections/browser','POST /connections/browser/{id}/login-session','POST /connections/browser/{id}/login-session/complete','DELETE /connections/browser/{id}'],'connection');allowResponseFields(['GET /secrets','POST /secrets','POST /secrets/{id}/rotate','DELETE /secrets/{id}'],'secret');allowResponseFields(['GET /audit','GET /activity'],'audit');allowResponseFields(['GET /support/tickets','POST /support/tickets','POST /support/tickets/{id}/status'],'ticket');allowResponseFields(['GET /leads'],'lead');allowResponseFields(['GET /settings','POST /settings'],'settings');allowResponseFields(['GET /copilot/actions','GET /copilot/conversation','POST /copilot/messages','POST /copilot/actions/{id}/apply','POST /copilot/actions/{id}/discard'],'copilot');allowResponseFields(['GET /tenants/{tenantId}/summary'],'summary');
          const ERROR_RESPONSE_FIELDS=new Set(['error','code','message','correlationId','retryAfterSeconds','allowedEmailDomains','organizationName','email','organizationStatus','limit','inFlight','preflight']);
          let responseRoute='UNSET';
          const projectRouteResponse=(route,status,body)=>{if(body===null||body===undefined||typeof body!=='object')return body;const fields=status>=400?ERROR_RESPONSE_FIELDS:RESPONSE_FIELDS_BY_ROUTE.get(route);if(!fields){console.error('response allowlist missing',{route,status});return {};}const one=value=>{if(value===null||typeof value!=='object'||Array.isArray(value))return value;return Object.fromEntries(Object.entries(value).filter(([key])=>fields.has(key)));};return Array.isArray(body)?body.map(one):one(body);};
          // One correlation identifier per invocation, so a customer reporting "it said forbidden"
          // can be matched to the exact log line. A Lambda container serves one invocation at a
          // time, so module scope is the right lifetime.
          let correlationId=null;
          let requestStartedAt=null,requestUserId=null,requestOrgId=null,lastPermissionCheck=null,requestReadTruncated=false,responsePagination=null,requestQuery=null;
          const CODE_FOR_STATUS={400:'BAD_REQUEST',401:'UNAUTHENTICATED',403:'FORBIDDEN',404:'NOT_FOUND',409:'CONFLICT',422:'UNPROCESSABLE',429:'TOO_MANY_REQUESTS',500:'INTERNAL_ERROR',502:'UPSTREAM_ERROR',503:'UNAVAILABLE'};
          // The structured error envelope, added ALONGSIDE the flat `error` field rather than
          // replacing it: the deployed frontend still reads `error`, so removing it would break every
          // error message in the product on the day this shipped. Both shapes are emitted until the
          // frontend has moved over.
          //
          // `code` is the machine-readable half and must stay stable while prose changes, so it is
          // NEVER derived from the message. It is either passed explicitly by the call site
          // (NO_ORGANIZATION, SESSION_REVOKED) or falls back to the status's own name, which is
          // stable by construction.
          const withErrorEnvelope=(status,body)=>{
            if(status<400||!body||typeof body!=='object'||typeof body.error!=='string') return body;
            return {...body,code:body.code||CODE_FOR_STATUS[status]||'ERROR',message:body.message||body.error,correlationId};
          };
          // Task 9.10 / requirement 1.8-1.10: the three surfaces, echoed one at a time.
          //
          // This replaced 'access-control-allow-origin: *'. The wildcard was not merely untidy: it
          // told every browser on the internet that any page, on any origin, may read this API's
          // responses. Bearer-token auth means a drive-by page cannot get a token, so the wildcard was
          // not directly exploitable -- but "not exploitable given the current auth scheme" is a
          // property of the auth scheme, not of the header, and the header outlives the scheme.
          //
          // Exactly one origin is echoed, and only if it is on the list. An unknown origin gets NO
          // header at all rather than a refusal, which is the correct shape: the browser then refuses
          // the read itself. `vary: origin` is required because the response now differs per origin and
          // any cache in front of this must not serve one surface's response to another.
          const ALLOWED_ORIGINS=['https://amazflow.com','https://www.amazflow.com','https://app.amazflow.com','https://admin.amazflow.com'];
          let requestOrigin=null;
          const allowedOriginFor=e=>{const h=e&&e.headers||{};const raw=h.origin||h.Origin;return typeof raw==='string'&&ALLOWED_ORIGINS.includes(raw)?raw:null;};
          const corsHeaders=()=>requestOrigin?{'access-control-allow-origin':requestOrigin,'vary':'origin'}:{};
          const logRequest=(status)=>{console.log(JSON.stringify({correlationId,routeKey:responseRoute,userId:requestUserId,orgId:requestOrgId,status,durationMs:requestStartedAt?Date.now()-requestStartedAt:null,permission:lastPermissionCheck?lastPermissionCheck.permission:null,decision:lastPermissionCheck?lastPermissionCheck.decision:null}));};
          const opaqueCursor=offset=>Buffer.from(JSON.stringify({offset}),'utf8').toString('base64url');
          const readCursor=value=>{if(!value)return 0;try{const parsed=JSON.parse(Buffer.from(String(value),'base64url').toString('utf8'));if(!Number.isInteger(parsed.offset)||parsed.offset<0)throw new Error('invalid');return parsed.offset;}catch{throw {status:400,message:'The pagination cursor is invalid',code:'INVALID_CURSOR'};}};
          const paginateList=(items,query={})=>{const rawSize=query.pageSize??query.page_size;const pageSize=rawSize===undefined?50:Number(rawSize);if(!Number.isInteger(pageSize)||pageSize<1||pageSize>200)throw {status:400,message:'pageSize must be an integer between 1 and 200',code:'INVALID_PAGE_SIZE'};const offset=readCursor(query.cursor);const page=items.slice(offset,offset+pageSize);const nextOffset=offset+page.length;responsePagination={pageSize,nextCursor:nextOffset<items.length?opaqueCursor(nextOffset):null,truncated:requestReadTruncated};return page;};
          const reply=(s,b)=>{const paged=Array.isArray(b)?paginateList(b,requestQuery||{}):b;const projected=projectRouteResponse(responseRoute,s,withErrorEnvelope(s,paged));logRequest(s);return {statusCode:s,headers:{'content-type':'application/json',...(correlationId?{'x-correlation-id':correlationId}:{}),...(responsePagination?{'x-page-size':String(responsePagination.pageSize),...(responsePagination.nextCursor?{'x-next-cursor':responsePagination.nextCursor}:{}),'x-list-truncated':responsePagination.truncated?'true':'false'}:{}),...corsHeaders()},body:JSON.stringify(projected,(key,value)=>privateResponseFields.has(key)?undefined:value)};};
          // API Gateway's JWT authorizer forwards the cognito:groups claim as the literal
          // string "[GROUP1, GROUP2]" (brackets included as characters), not a clean
          // comma list and not a real array -- strip the brackets before splitting.
          // A token with no organization claim yields NO usable principal. role is deliberately left
          // undefined in that case rather than returned alongside a missing tenantId, because every
          // authorization check below is written as `a.role===...` or `a.role!==...` -- so a principal
