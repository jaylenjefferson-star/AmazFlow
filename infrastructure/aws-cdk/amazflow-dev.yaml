  # Public: the login page reads an organization's branding before anyone is authenticated.
  # Only ever returns four display fields (never a secret) -- see validateBranding.
  OrganizationBrandingGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /organizations/{slug}/branding'
      Target: !Sub integrations/${ApiIntegration}
