  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ControlPlaneFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # Sweeps for expired agent tasks and confirmation gates so a run can never sit stuck in
  # WAITING_AGENT/AWAITING_CONFIRMATION indefinitely -- expiresAt was previously only ever
  # checked client-side by the Chrome extension, never enforced server-side.
  SweepScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: amazflow-dev-sweep-expired
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: ControlPlaneSweepTarget
          Arn: !GetAtt ControlPlaneFunction.Arn
          Input: '{"source":"amazflow.sweep"}'

  SweepInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ControlPlaneFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweepScheduleRule.Arn

  # Requirement 26.12 / task 34.19: alarms on the metrics this Lambda already emits
  # (emitApplicationMetric, namespace AmazFlow/AgentCore). An alarm nobody is notified by is not
  # "published" in any operational sense, so the topic and its conditional subscription exist
  # alongside the alarms rather than being left for later -- SNS refuses an empty email endpoint
  # outright, so the subscription is conditional on AlarmEmail actually being set.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: AmazFlow operational alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  AgentFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Five or more agent execution failures in five minutes
      Namespace: AmazFlow/AgentCore
      MetricName: AgentFailure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AuthorizationDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An unusual volume of authorization denials in five minutes -- possibly a
        misconfigured integration or a probing attempt, not routine role-based refusals
      Namespace: AmazFlow/AgentCore
      MetricName: AuthorizationDenied
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  CrossOrganizationAccessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A cross-organization staff access attempt was recorded
      Namespace: AmazFlow/AgentCore
      MetricName: CrossOrganizationAccess
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  BrowserFallbackAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ten or more managed-browser executions fell back to a connected agent in five minutes
      Namespace: AmazFlow/AgentCore
      MetricName: BrowserFallback
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ScanTruncatedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A staff cross-organization list hit the page guard and was truncated -- task
        21.9's indexed queries are what removes this risk; until then, any occurrence is worth a look
      Namespace: AmazFlow/AgentCore
      MetricName: ScanTruncated
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl: { Value: !GetAtt HttpApi.ApiEndpoint }
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  TableName: { Value: !Ref ControlPlaneTable }
  BedrockModel: { Value: !Ref BedrockModelId }
  CognitoDomain: { Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com' }
  AlarmTopicArn: { Value: !Ref AlarmTopic, Description: 'Subscribe additional operations addresses to this topic directly; AlarmEmail only wires the first one' }
