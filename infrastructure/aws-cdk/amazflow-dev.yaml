            try{const issued=await createInvitationRecord(tenantId,email,invitedRole,a);invitationLink=issued.acceptUrl;}catch(err){console.error('invite: invitation record not created',{tenantId,email,error:err&&err.message});}

            await logActivity(tenantId,{
              actor:a.userId,
              actorLabel:actorLabelFor(asPrincipal(a)),
              action:'TEAM_MEMBER_INVITED',
              summary:`Invited ${email} as ${role==='CLIENT_ADMIN'?'a team admin':'a team member'}`,
              details:{email,role,platformRole:invitedRole},
            });
            return {acceptUrl:invitationLink,username,email,role,enabled:true,userStatus:created?.User?.UserStatus||'FORCE_CHANGE_PASSWORD',invited:true};
          };
          const tenantSummary=async(tenantId)=>{
            const scopeArgs={role:'CLIENT_ADMIN',tenantId};
            const [workflows,runs]=await Promise.all([scanType('WORKFLOW#',scopeArgs),scanType('RUN#',scopeArgs)]);
            const workflowById=new Map(workflows.map(w=>[w.id,w]));
            let totalMinutesSaved=0,totalRunsCompleted=0;
            for(const run of runs){
              if(run.status!=='COMPLETED') continue;
              totalRunsCompleted++;
              const estimate=workflowById.get(run.workflowId)?.manualMinutesEstimate;
              if(typeof estimate!=='number'||estimate<=0) continue;
              const actualMinutes=(new Date(run.updatedAt)-new Date(run.createdAt))/60000;
              totalMinutesSaved+=Math.max(0,estimate-actualMinutes);
            }
            return {totalRunsCompleted,totalMinutesSaved:Math.round(totalMinutesSaved)};
          };

          // ---------- Organization branding (Phase 10 whitelabel prep) ----------
          // Deliberately narrow: four constrained fields, never arbitrary CSS/HTML. AmazFlow's
          // own wordmark and product chrome remain dominant everywhere -- this only lets a
          // customer's own sign-in screen show their name/logo/accent alongside it.
          const validateBranding=(body)=>{
            const out={};
            if('displayName' in body) out.displayName=String(body.displayName||'').trim().slice(0,80);
            if('loginMessage' in body) out.loginMessage=String(body.loginMessage||'').trim().slice(0,240);
            if('accent' in body){
              const v=String(body.accent||'').trim();
              if(v&&!/^#[0-9a-fA-F]{6}$/.test(v)) throw {status:400,message:'accent must be a 6-digit hex color like #ff765c'};
              out.accent=v;
            }
            if('logoUrl' in body){
              const v=String(body.logoUrl||'').trim();
              if(v&&(!/^https:\/\//i.test(v)||isUnsafeUrl(v))) throw {status:400,message:'logoUrl must be a public https:// URL'};
              out.logoUrl=v;
            }
            return out;
          };

          // ---------- Organization profile and settings ----------
          // Deliberately small. Every field below is read by something: status and
          // maxConcurrentRuns gate run creation, allowedEmailDomains gates who can be invited,
          // timezone is what the operator console formats an org's timestamps in. A setting that
          // is stored and never read is worse than a missing one, because the console then
          // reports a control that does nothing.
          // Counted as "in flight" for the concurrency limit. Deliberately a positive list: a run
          // status added later is then not counted, so an unrecognised status fails open and lets
          // work start, rather than failing closed and blocking a customer for a vocabulary gap.
          const LIVE_RUN_STATUSES=['RUNNING','WAITING_AGENT','WAITING_APPROVAL','AWAITING_CONFIRMATION'];
          const ORG_STATUSES=['active','paused','suspended'];
          const ORG_PLANS=['design_partner','pilot','standard','enterprise'];
          const DEFAULT_ORG_SETTINGS={maxConcurrentRuns:0,allowedEmailDomains:[],timezone:'UTC'};
          const orgSettings=(org)=>({...DEFAULT_ORG_SETTINGS,...(org&&org.settings?org.settings:{})});

          // name/status/plan. Slug is immutable: it IS the tenant id, carried in every Cognito
          // claim and every partition key, so renaming it would orphan the tenant's data.
          const validateOrgProfile=(body)=>{
            const out={};
            if('name' in body){
              const v=String(body.name||'').trim();
              if(!v) throw {status:400,message:'A name is required'};
              out.name=v.slice(0,120);
            }
            if('status' in body){
              const v=String(body.status||'').trim();
              if(!ORG_STATUSES.includes(v)) throw {status:400,message:`status must be one of ${ORG_STATUSES.join(', ')}`};
              out.status=v;
            }
            if('plan' in body){
              const v=String(body.plan||'').trim();
              if(!ORG_PLANS.includes(v)) throw {status:400,message:`plan must be one of ${ORG_PLANS.join(', ')}`};
              out.plan=v;
            }
            if('slug' in body) throw {status:400,message:'An organization slug cannot be changed: it is the tenant identifier'};
            return out;
          };

          const validateOrgSettings=(body)=>{
            const out={};
            if('maxConcurrentRuns' in body){
              const v=Number(body.maxConcurrentRuns);
              if(!Number.isInteger(v)||v<0||v>1000) throw {status:400,message:'maxConcurrentRuns must be a whole number between 0 and 1000 (0 means no limit)'};
              out.maxConcurrentRuns=v;
            }
            if('allowedEmailDomains' in body){
              const raw=Array.isArray(body.allowedEmailDomains)?body.allowedEmailDomains:[];
              if(raw.length>20) throw {status:400,message:'At most 20 email domains'};
              const seen=[];
              for(const entry of raw){
                // Stored bare and lowercased so comparison at invite time is a plain equality
                // check rather than a parse. Accepts "@acme.com" and "ACME.com" as the same thing.
                const d=String(entry||'').trim().toLowerCase().replace(/^@+/,'');
                if(!d) continue;
                if(!/^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/.test(d)) throw {status:400,message:`"${entry}" is not a valid email domain`};
                if(!seen.includes(d)) seen.push(d);
              }
              out.allowedEmailDomains=seen;
            }
            if('timezone' in body){
              const v=String(body.timezone||'').trim()||'UTC';
              // Validated against the runtime's own tz database rather than a hardcoded list, so
              // it cannot drift and cannot be used to smuggle arbitrary text into the console.
              try{new Intl.DateTimeFormat('en-US',{timeZone:v});}catch(err){throw {status:400,message:`"${v}" is not a recognized time zone`};}
              out.timezone=v;
            }
            return out;
          };

          // ---------- Activity log ----------
          // Separate from a run's own audit[] (what an execution did). This records what an
          // ADMIN -- human or via Copilot -- did to the configuration itself, so every
          // Copilot-driven change is traceable to a named actor, never anonymous.
          const logActivity=async(tenantId,entry,notification)=>{
            const id=`act_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
            const doc={id,tenantId,at:now(),...entry,correlationId};
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:`TENANT#${tenantId}`},sk:{S:`ACTIVITY#${String(Date.now()).padStart(14,'0')}_${id}`},tenantId:{S:tenantId},document:{S:JSON.stringify(doc)},updatedAt:{S:now()}}}));
            // Requirement 22.2, enforced as a COUPLING rather than as a rule somebody follows: this is the
            // ONLY way to create a notification, and it runs after the audit record is durable. So a
            // notification cannot exist for an event that did not occur -- there is no notify() to call on
            // its own. Best effort while the audit write is not: an event without its notification is a
            // missed nudge, a notification without its event sends somebody looking for work that never was.
            if(notification){try{await saveNotification(buildNotification(tenantId,{...notification,eventId:id}));}catch(err){console.error('notification not created for recorded event',{tenantId,action:entry.action,error:err&&err.message});}}
            return doc;
          };
          const ONBOARDING_STATUS_SET=['PROSPECT','CLOSED_WON','SETUP_REQUIRED','ONBOARDING','CONFIGURATION','TESTING','READY_FOR_LAUNCH','ACTIVE','PAUSED','CHURNED'];
          const ONBOARDING_MILESTONES=['administratorInvited','administratorActivated','firstIntegration','firstAgent','workflowCreated','workflowPublished','firstProductionRun'];
          const onboardingKey=tenantId=>({pk:{S:`TENANT#${tenantId}`},sk:{S:'ONBOARDING'}});
          const defaultOnboarding=tenantId=>({tenantId,status:'PROSPECT',crmReference:null,internalOwner:null,milestones:Object.fromEntries(ONBOARDING_MILESTONES.map(k=>[k,null])),checklist:{},internalNotes:'',updatedAt:now()});
          const readOnboarding=async tenantId=>{const out=await db.send(new GetItemCommand({TableName:table,Key:onboardingKey(tenantId)}));if(out.Item&&out.Item.document&&out.Item.document.S)return JSON.parse(out.Item.document.S);const record=defaultOnboarding(tenantId);await db.send(new PutItemCommand({TableName:table,Item:{...onboardingKey(tenantId),tenantId:{S:tenantId},document:{S:JSON.stringify(record)},updatedAt:{S:now()}},ConditionExpression:'attribute_not_exists(pk)'})).catch(err=>{if(err&&err.name!=='ConditionalCheckFailedException')throw err;});return record;};
          const saveOnboarding=record=>db.send(new PutItemCommand({TableName:table,Item:{...onboardingKey(record.tenantId),tenantId:{S:record.tenantId},document:{S:JSON.stringify(record)},updatedAt:{S:now()}}}));
          const observeOnboarding=async(tenantId,milestone,at=now())=>{if(!tenantId||!ONBOARDING_MILESTONES.includes(milestone))return;const record=await readOnboarding(tenantId);if(record.milestones&&record.milestones[milestone])return;const next={...record,milestones:{...record.milestones,[milestone]:at},updatedAt:at};await saveOnboarding(next);await logActivity(tenantId,{actor:'system',actorLabel:'AmazFlow platform',action:'ONBOARDING_MILESTONE_OBSERVED',summary:`Observed onboarding milestone ${milestone}`,details:{milestone,at}});if(milestone==='firstProductionRun'){const org=await getOrganization(tenantId);if(org&&!org.activatedAt)await saveOrganization({...org,activatedAt:at,updatedAt:at});}};
          const onboardingForCustomer=record=>({tenantId:record.tenantId,status:record.status,milestones:record.milestones,checklist:record.checklist,updatedAt:record.updatedAt});

          // ---------- AmazFlow Copilot ----------
          // A persistent SUPER_ADMIN assistant with real read access to platform data and a
          // strictly draft-first write path: every write tool below only ever proposes a change
          // (a COPILOTACTION record) -- it never mutates a live workflow or organization
          // directly. A human must call the apply endpoint to actually commit it, at which point
          // it's attributed in the activity log to "Jay via AmazFlow Copilot" rather than the
          // model silently acting on its own.
          const COPILOT_SYSTEM='You are AmazFlow Copilot, an internal assistant for AmazFlow\'s own SUPER_ADMIN operator (not a customer-facing assistant). You help configure workflows, diagnose runs, and manage the platform.\nRules you must never break:\n- Only state facts you obtained from a tool call in this conversation. If you have not called a tool that would answer the question, call one before answering. Never guess at a run\'s status, a workflow\'s steps, or why something failed -- always look it up.\n- You cannot directly change anything. Every write tool only proposes a change for a human to review and apply -- say so plainly when you use one ("I\'ve prepared this change, review and apply it below"), and never claim a change is live until the human has applied it.\n- Prefer the smallest change that satisfies the request. When editing a published (active) workflow, always base your edit on its current real content from get_workflow first.\n- Roles must be exactly one of FRONTLINE, CLIENT_ADMIN, SUPER_ADMIN. Providers must be exactly one of browser, api, spreadsheet, email, file, mock. Never invent other values.\n- Be concise. This is an expert operator, not a customer.';

          const COPILOT_TOOLS=[
            {toolSpec:{name:'list_workflows',description:'List every workflow definition across all customer tenants with id, name, version, status, tenantId, assignedRoles.',inputSchema:{json:{type:'object',properties:{}}}}},
            {toolSpec:{name:'get_workflow',description:'Get the full definition of one workflow version, including every step. Call this before proposing any edit.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'},version:{type:'number',description:'Optional. Omit for the current version.'}},required:['tenantId','workflowId']}}}},
            {toolSpec:{name:'list_runs',description:'List recent workflow runs, optionally filtered by tenant, workflow, or status.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'},status:{type:'string'}}}}}},
            {toolSpec:{name:'get_run',description:'Get one run in full, including its audit trail and step results. This is the only reliable way to answer "why did this run fail/stop" -- the audit array and stepResults contain the real recorded evidence.',inputSchema:{json:{type:'object',properties:{runId:{type:'string'}},required:['runId']}}}},
            {toolSpec:{name:'list_organizations',description:'List every customer organization with its slug, status, plan, and current branding settings.',inputSchema:{json:{type:'object',properties:{}}}}},
            {toolSpec:{name:'list_agents',description:'List browser automation agents, optionally filtered by tenant.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'}}}}}},
            {toolSpec:{name:'list_activity',description:'List recent admin/Copilot-driven configuration changes (the activity log), optionally filtered by tenant.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'}}}}}},
            {toolSpec:{name:'create_draft',description:'Propose starting a new editable draft version of an existing workflow, cloned unchanged from its current content. Use before proposing edits to a published (active) workflow.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'}},required:['tenantId','workflowId']}}}},
            {toolSpec:{name:'duplicate_workflow',description:'Propose copying an existing workflow to a brand-new workflow id as a fresh draft (e.g. for a variant or a different customer).',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'},newTenantId:{type:'string'},newWorkflowId:{type:'string'},newName:{type:'string'}},required:['tenantId','workflowId','newWorkflowId','newName']}}}},
            {toolSpec:{name:'update_step',description:'Propose changing fields on one step of a workflow (creating a draft automatically if the workflow is currently published). Pass only the fields to change.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'},stepId:{type:'string'},patch:{type:'object',description:'Fields to merge into the step, e.g. {"confidenceThreshold":0.9}'}},required:['tenantId','workflowId','stepId','patch']}}}},
            {toolSpec:{name:'add_step',description:'Propose adding a new step (commonly type "condition", "approval", or "verify") to a workflow, creating a draft automatically if needed. The step object must include a unique id and a type.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'},step:{type:'object'}},required:['tenantId','workflowId','step']}}}},
            {toolSpec:{name:'assign_workflow_roles',description:'Propose changing which roles (FRONTLINE, CLIENT_ADMIN, SUPER_ADMIN) a workflow is assigned to.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'},assignedRoles:{type:'array',items:{type:'string'}}},required:['tenantId','workflowId','assignedRoles']}}}},
            {toolSpec:{name:'set_workflow_status',description:'Propose publishing a draft (status active), returning a published workflow to draft, or archiving it. This changes what customers can actually run, so treat it as high-risk.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},workflowId:{type:'string'},status:{type:'string',enum:['draft','testing','active','archived']}},required:['tenantId','workflowId','status']}}}},
            {toolSpec:{name:'update_organization_branding',description:'Propose updating a customer organization\'s sign-in branding: displayName, logoUrl (https only), accent (hex color), loginMessage. AmazFlow\'s own branding always remains dominant regardless of these settings.',inputSchema:{json:{type:'object',properties:{slug:{type:'string'},displayName:{type:'string'},logoUrl:{type:'string'},accent:{type:'string'},loginMessage:{type:'string'}},required:['slug']}}}},
            {toolSpec:{name:'generate_workflow_draft_from_sop',description:'Propose a brand-new workflow draft generated from a plain-language standard operating procedure description (the Agent Builder). Use when the operator describes a process rather than exact steps.',inputSchema:{json:{type:'object',properties:{tenantId:{type:'string'},sop:{type:'string'}},required:['tenantId','sop']}}}}
          ];

          const proposeAction=async(userId,tenantId,kind,summary,payload)=>{
            const id=`copact_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
            const action={id,userId,tenantId,kind,summary,payload,status:'PENDING',createdAt:now()};
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`COPILOTACTION#${id}`},document:{S:JSON.stringify(action)},updatedAt:{S:now()}}}));
            return action;
          };

          const findWorkflow=async(tenantId,workflowId)=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:`TENANT#${tenantId}`},sk:{S:`WORKFLOW#${workflowId}`}}}));
            return out.Item&&out.Item.document?.S?parse(out.Item):null;
          };

          // Copies a workflow's current live content into an unpublished, incrementing-version
          // draft -- the only way any Copilot write tool is allowed to touch a published
          // workflow. The live WORKFLOW# doc is never modified until a human explicitly applies
          // a set_workflow_status publish action.
          const draftFrom=(workflow)=>({...workflow,version:(workflow.version||1)+1,status:'draft'});

          const runCopilotTool=async(userId,name,input)=>{
            if(name==='list_workflows'){
              const items=await scanType('WORKFLOW#',{role:'SUPER_ADMIN'});
              return items.map(w=>({id:w.id,tenantId:w.tenantId,name:w.name,version:w.version,status:w.status,assignedRoles:w.assignedRoles}));
            }
            if(name==='get_workflow'){
              if(input.version) return await getWorkflowVersion(input.tenantId,input.workflowId,input.version);
              const w=await findWorkflow(input.tenantId,input.workflowId);
              if(!w) throw new Error(`No workflow ${input.workflowId} in tenant ${input.tenantId}`);
              return w;
            }
            if(name==='list_runs'){
              let items=await scanType('RUN#',{role:'SUPER_ADMIN'});
              if(input.tenantId) items=items.filter(r=>r.tenantId===input.tenantId);
              if(input.workflowId) items=items.filter(r=>r.workflowId===input.workflowId);
              if(input.status) items=items.filter(r=>r.status===input.status);
              return items.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))).slice(0,25).map(r=>({id:r.id,tenantId:r.tenantId,workflowId:r.workflowId,status:r.status,currentStepId:r.currentStepId,createdBy:r.createdBy,createdAt:r.createdAt,updatedAt:r.updatedAt}));
            }
            if(name==='get_run'){
              const items=await scanType('RUN#',{role:'SUPER_ADMIN'});
              const run=items.find(r=>r.id===input.runId);
              if(!run) throw new Error(`No run ${input.runId}`);
              return run;
            }
            if(name==='list_organizations') return await listOrganizations();
            if(name==='list_agents'){
              let items=await scanType('AGENT#',{role:'SUPER_ADMIN'});
              if(input.tenantId) items=items.filter(x=>x.tenantId===input.tenantId);
              return items;
            }
            if(name==='list_activity'){
              let items=await scanType('ACTIVITY#',{role:'SUPER_ADMIN'});
              if(input.tenantId) items=items.filter(x=>x.tenantId===input.tenantId);
              return items.sort((x,y)=>String(y.at).localeCompare(String(x.at))).slice(0,25);
            }
            if(name==='create_draft'){
              const w=await findWorkflow(input.tenantId,input.workflowId);
              if(!w) throw new Error(`No workflow ${input.workflowId} in tenant ${input.tenantId}`);
              const draft=draftFrom(w);
              const action=await proposeAction(userId,input.tenantId,'WORKFLOW_DRAFT',`New draft v${draft.version} of "${w.name}", cloned unchanged from v${w.version}`,{op:'SAVE_WORKFLOW',workflow:draft,before:w});
              return {proposed:true,actionId:action.id,summary:action.summary};
            }
            if(name==='duplicate_workflow'){
              const w=await findWorkflow(input.tenantId,input.workflowId);
              if(!w) throw new Error(`No workflow ${input.workflowId} in tenant ${input.tenantId}`);
              const targetTenantId=input.newTenantId||input.tenantId;
              const copy={...w,id:input.newWorkflowId,tenantId:targetTenantId,name:input.newName,version:1,status:'draft'};
              const shapeError=validateWorkflowShape(copy);
              if(shapeError) throw new Error(shapeError);
              const action=await proposeAction(userId,targetTenantId,'WORKFLOW_DUPLICATE',`New workflow "${input.newName}" (${input.newWorkflowId}) copied from "${w.name}"`,{op:'SAVE_WORKFLOW',workflow:copy,before:null});
              return {proposed:true,actionId:action.id,summary:action.summary};
            }
            if(name==='update_step'){
              const w=await findWorkflow(input.tenantId,input.workflowId);
              if(!w) throw new Error(`No workflow ${input.workflowId} in tenant ${input.tenantId}`);
              const before=JSON.parse(JSON.stringify(w));
              const target=w.status==='draft'?w:draftFrom(w);
              const stepIndex=target.steps.findIndex(s=>s.id===input.stepId);
              if(stepIndex<0) throw new Error(`No step ${input.stepId} on workflow ${input.workflowId}`);
              target.steps=target.steps.map((s,i)=>i===stepIndex?{...s,...input.patch}:s);
              const shapeError=validateWorkflowShape(target);
              if(shapeError) throw new Error(shapeError);
              const action=await proposeAction(userId,input.tenantId,'WORKFLOW_STEP_UPDATE',`${w.status==='draft'?'Update':`New draft v${target.version} updating`} step "${input.stepId}" on "${w.name}"`,{op:'SAVE_WORKFLOW',workflow:target,before});
              return {proposed:true,actionId:action.id,summary:action.summary};
            }
            if(name==='add_step'){
              const w=await findWorkflow(input.tenantId,input.workflowId);
              if(!w) throw new Error(`No workflow ${input.workflowId} in tenant ${input.tenantId}`);
              const before=JSON.parse(JSON.stringify(w));
              const target=w.status==='draft'?w:draftFrom(w);
              if(target.steps.some(s=>s.id===input.step?.id)) throw new Error(`Step id "${input.step?.id}" already exists`);
              target.steps=[...target.steps,input.step];
              const shapeError=validateWorkflowShape(target);
              if(shapeError) throw new Error(shapeError);
              const action=await proposeAction(userId,input.tenantId,'WORKFLOW_STEP_ADD',`${w.status==='draft'?'Add':`New draft v${target.version} adding`} step "${input.step?.id}" (${input.step?.type}) to "${w.name}"`,{op:'SAVE_WORKFLOW',workflow:target,before});
              return {proposed:true,actionId:action.id,summary:action.summary};
            }
            if(name==='assign_workflow_roles'){
              const w=await findWorkflow(input.tenantId,input.workflowId);
              if(!w) throw new Error(`No workflow ${input.workflowId} in tenant ${input.tenantId}`);
              const valid=['FRONTLINE','CLIENT_ADMIN','SUPER_ADMIN'];
              const roles=(input.assignedRoles||[]).filter(r=>valid.includes(r));
              if(!roles.length) throw new Error('assignedRoles must include at least one of FRONTLINE, CLIENT_ADMIN, SUPER_ADMIN');
              const target={...w,assignedRoles:roles};
              const action=await proposeAction(userId,input.tenantId,'WORKFLOW_ROLES',`Assign "${w.name}" to roles: ${roles.join(', ')}`,{op:'SAVE_WORKFLOW',workflow:target,before:w});
              return {proposed:true,actionId:action.id,summary:action.summary};
            }
            if(name==='set_workflow_status'){
              const w=await findWorkflow(input.tenantId,input.workflowId);
              if(!w) throw new Error(`No workflow ${input.workflowId} in tenant ${input.tenantId}`);
              if(!WORKFLOW_STATUSES.includes(input.status)) throw new Error(`status must be one of ${WORKFLOW_STATUSES.join(', ')}`);
              const target={...w,status:input.status};
              const action=await proposeAction(userId,input.tenantId,'WORKFLOW_STATUS',`Set "${w.name}" v${w.version} to ${input.status} (currently ${w.status})`,{op:'SAVE_WORKFLOW',workflow:target,before:w});
              return {proposed:true,actionId:action.id,summary:action.summary,highRisk:true};
            }
            if(name==='update_organization_branding'){
              const org=await getOrganization(input.slug);
              if(!org) throw new Error(`No organization with slug ${input.slug}`);
              const patch=validateBranding(input);
              const target={...org,branding:{...(org.branding||{}),...patch}};
              const action=await proposeAction(userId,org.slug,'ORG_BRANDING',`Update sign-in branding for "${org.name}"`,{op:'SAVE_ORG',org:target,before:org});
              return {proposed:true,actionId:action.id,summary:action.summary};
            }
            if(name==='generate_workflow_draft_from_sop'){
              const draft=await generateWorkflowFromSop(input.sop,input.tenantId||'amazflow');
              const action=await proposeAction(userId,draft.tenantId,'WORKFLOW_GENERATED',`New workflow draft "${draft.name}" generated from your description`,{op:'SAVE_WORKFLOW',workflow:draft,before:null});
              return {proposed:true,actionId:action.id,summary:action.summary};
            }
            throw new Error(`Unknown tool ${name}`);
          };

          const loadCopilotConversation=async(userId)=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:'PLATFORM'},sk:{S:`COPILOTCONV#${userId}`}}}));
            if(out.Item&&out.Item.document?.S) return JSON.parse(out.Item.document.S);
            return {userId,messages:[]};
          };
          const saveCopilotConversation=async(conv)=>db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`COPILOTCONV#${conv.userId}`},document:{S:JSON.stringify(conv)},updatedAt:{S:now()}}}));

          // A human-readable label for whatever screen the operator was on when they sent this
          // message -- lets Copilot open by acknowledging what's on screen instead of asking
          // "which workflow do you mean" when the answer is already visible to the operator.
          const SECTION_LABEL={overview:'the Global Overview dashboard',workflows:'Workflow Studio',clients:'the Clients list',runs:'the Runs list',approvals:'the Approvals queue',exceptions:'the Exceptions triage view',connections:'Connections',agents:'Agents',audit:'Audit & Policy',settings:'Platform Settings',support:'Support'};
          const describeContext=(context)=>{
            if(!context||!context.section) return null;
            const label=SECTION_LABEL[context.section]||context.section;
            return context.entityId?`The operator is currently viewing ${label}, looking at record "${context.entityId}". If that's what they mean by "this" or "here", use it -- otherwise call a tool to confirm.`:`The operator is currently viewing ${label}.`;
          };
          const stripThinking=(value)=>String(value||'').replace(/<thinking>[\s\S]*?<\/thinking>\s*/gi,'').trim();
          const runCopilotTurn=async(userId,userMessage,context)=>{
            const conv=await loadCopilotConversation(userId);
            conv.messages=(conv.messages||[]).map(message=>({...message,content:(message.content||[]).map(block=>block.text?{...block,text:stripThinking(block.text)}:block)}));
            const working=[...conv.messages,{role:'user',content:[{text:userMessage}]}];
            const pendingActions=[];
            const contextNote=describeContext(context);
            const system=contextNote?[{text:COPILOT_SYSTEM},{text:contextNote}]:[{text:COPILOT_SYSTEM}];
            for(let guard=0;guard<6;guard++){
              const out=await bedrock.send(new ConverseCommand({modelId:process.env.BEDROCK_MODEL_ID,system,messages:working,toolConfig:{tools:COPILOT_TOOLS},inferenceConfig:{maxTokens:1500,temperature:0.2}}));
              const message=out.output?.message;
              if(!message) break;
              working.push(message);
              if(out.stopReason!=='tool_use'){
                const text=stripThinking(message.content?.find(c=>c.text)?.text||'');
                conv.messages=[...conv.messages,{role:'user',content:[{text:userMessage}]},{role:'assistant',content:[{text}]}];
                await saveCopilotConversation(conv);
                return {reply:text,pendingActions};
              }
              const toolResults=[];
              for(const block of message.content||[]){
                if(!block.toolUse) continue;
                try{
                  const result=await runCopilotTool(userId,block.toolUse.name,block.toolUse.input||{});
                  if(result&&result.proposed) pendingActions.push(result);
                  toolResults.push({toolResult:{toolUseId:block.toolUse.toolUseId,content:[{json:result}]}});
                }catch(toolErr){
                  toolResults.push({toolResult:{toolUseId:block.toolUse.toolUseId,content:[{json:{error:toolErr.message}}],status:'error'}});
                }
              }
              working.push({role:'user',content:toolResults});
            }
            const fallback="I wasn't able to finish that within my tool-call budget -- try breaking the request into smaller steps.";
            conv.messages=[...conv.messages,{role:'user',content:[{text:userMessage}]},{role:'assistant',content:[{text:fallback}]}];
            await saveCopilotConversation(conv);
            return {reply:fallback,pendingActions};
          };

          const applyCopilotAction=async(actionId,a)=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:'PLATFORM'},sk:{S:`COPILOTACTION#${actionId}`}}}));
            if(!out.Item||!out.Item.document?.S) throw {status:404,message:'Proposed action not found'};
            const action=JSON.parse(out.Item.document.S);
            if(action.status!=='PENDING') throw {status:409,message:`This action is already ${action.status.toLowerCase()}`};
            const payload=action.payload;
            if(payload.op==='SAVE_WORKFLOW'){
              const shapeError=validateWorkflowShape(payload.workflow);
              if(shapeError) throw {status:400,message:shapeError};
              payload.workflow.updatedAt=now();
              await save('WORKFLOW',payload.workflow);
              if(payload.workflow.version){
                const paddedV=String(payload.workflow.version).padStart(6,'0');
                await save('WORKFLOWVERSION',{...payload.workflow,id:`${payload.workflow.id}_v${paddedV}`});
              }
            } else if(payload.op==='SAVE_ORG'){
              payload.org.updatedAt=now();
              await saveOrganization(payload.org);
            } else {
              throw {status:500,message:`Unknown action payload op ${payload.op}`};
            }
            action.status='APPLIED'; action.appliedAt=now(); action.appliedBy=a.userId;
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`COPILOTACTION#${actionId}`},document:{S:JSON.stringify(action)},updatedAt:{S:now()}}}));
            await logActivity(action.tenantId,{actor:a.userId,actorLabel:'Jay via AmazFlow Copilot',action:action.kind,summary:action.summary});
            return action;
          };
          const discardCopilotAction=async(actionId)=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:'PLATFORM'},sk:{S:`COPILOTACTION#${actionId}`}}}));
            if(!out.Item||!out.Item.document?.S) throw {status:404,message:'Proposed action not found'};
            const action=JSON.parse(out.Item.document.S);
            if(action.status!=='PENDING') throw {status:409,message:`This action is already ${action.status.toLowerCase()}`};
            action.status='DISCARDED';
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`COPILOTACTION#${actionId}`},document:{S:JSON.stringify(action)},updatedAt:{S:now()}}}));
            return action;
          };

          // ---------- Platform settings ----------
          // A single PLATFORM/SETTINGS record backs the operator-configurable timeouts that used
          // to be hardcoded constants. Reading it costs one GetItem per call site; the defaults
          // below are exactly the values that were hardcoded before, so behavior is unchanged
          // until a SUPER_ADMIN actually saves a change.
          const DEFAULT_SETTINGS={taskExpiryMs:5*60000,confirmationExpiryMs:3600000,agentCodeExpiryMs:2*60000};
          const SETTINGS_BOUNDS={taskExpiryMs:[30000,3600000],confirmationExpiryMs:[60000,86400000],agentCodeExpiryMs:[30000,600000]};
          const getSettings=async()=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:'PLATFORM'},sk:{S:'SETTINGS'}}}));
            if(out.Item&&out.Item.document?.S) return {...DEFAULT_SETTINGS,...JSON.parse(out.Item.document.S)};
            return {...DEFAULT_SETTINGS};
          };
          const saveSettings=async(patch)=>{
            const current=await getSettings();
            const next={...current};
            for(const key of Object.keys(SETTINGS_BOUNDS)){
              if(!(key in patch)) continue;
              const value=Number(patch[key]);
              const [min,max]=SETTINGS_BOUNDS[key];
              if(!Number.isFinite(value)||value<min||value>max) throw {status:400,message:`${key} must be a number between ${min} and ${max}`};
              next[key]=value;
            }
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:'SETTINGS'},document:{S:JSON.stringify(next)},updatedAt:{S:now()}}}));
            return next;
          };

          // ---------- Browser connections ----------
          // Ported from services/control-plane/src/{handler,browser-connections}.ts so both copies
          // of the control plane expose the same route set (Phase 0b). The CRUD half works here
          // exactly as it does there. The managed-browser login half does not: a managed browser
          // needs AGENTCORE_BROWSER_ID, this stack does not provision one, so browserManagerReady()
          // is false and those two routes answer 503 with a plain reason. That is deliberate --
          // a route that exists and says "not configured here" is honest, whereas a route missing
          // from one copy is how the two drifted in the first place.
          // A connection may only ever point at a public HTTPS origin. Private and link-local
          // hosts are refused because a managed browser resolving them would be resolving them
          // inside AmazFlow's own network, not the customer's.
          const isPrivateHost=(hostname)=>{
            const host=String(hostname||'').toLowerCase().replace(/^\[|\]$/g,'');
            if(host==='localhost'||host.endsWith('.localhost')||host.endsWith('.local')||host==='::1'||host==='0:0:0:0:0:0:0:1') return true;
            if(/^(0|10|127|169\.254|192\.168)\./.test(host)||/^172\.(1[6-9]|2\d|3[01])\./.test(host)) return true;
            if(/^(fc|fd|fe8|fe9|fea|feb)/i.test(host)) return true;
            return false;
          };
          const publicHttps=(value,originOnly=false)=>{
            let url;
            try{ url=new URL(String(value==null?'':value)); }catch{ throw new Error('must be a valid URL'); }
            if(url.protocol!=='https:'||url.username||url.password||isPrivateHost(url.hostname)) throw new Error('must be a public HTTPS URL');
            if(originOnly&&(url.pathname!=='/'||url.search||url.hash||url.origin!==String(value).replace(/\/$/,''))) throw new Error('must be an HTTPS origin without a path, query, or fragment');
            return url;
          };
          const validateBrowserConnectionInput=(body)=>{
            const name=String(body.name==null?'':body.name).trim().slice(0,120);
            if(!name) throw new Error('A connection name is required');
            let base;
            try{ base=publicHttps(body.baseUrl); }catch(err){ throw new Error(`baseUrl ${err&&err.message?err.message:'is invalid'}`); }
            const configured=Array.isArray(body.allowedOrigins)?body.allowedOrigins:[base.origin];
            const allowedOrigins=[...new Set(configured.map(v=>{
              try{ return publicHttps(v,true).origin; }catch(err){ throw new Error(`Allowed origin ${err&&err.message?err.message:'is invalid'}`); }
            }))];
            if(!allowedOrigins.includes(base.origin)) throw new Error('Allowed origins must include the base URL origin');
            if(allowedOrigins.length>20) throw new Error('A connection can allow at most 20 origins');
            const preferredMode=body.preferredMode==='managed'||body.preferredMode==='connected'?body.preferredMode:'auto';
            return {name,baseUrl:base.toString(),allowedOrigins,preferredMode};
          };
          // managedProfileId identifies a browser profile holding a real signed-in session, so it
          // never leaves the server.
          const publicBrowserConnection=(connection)=>{ const {managedProfileId,...safe}=connection; return safe; };
          const getBrowserConnection=async(tenantId,id)=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:`TENANT#${tenantId}`},sk:{S:`BROWSERCONNECTION#${id}`}}}));
            return out.Item&&out.Item.document?.S?parse(out.Item):null;
          };
          const listBrowserConnections=async(a)=>{
            await authorizeIn(asPrincipal(a),'connection:read',{orgId:a.tenantId});
            return (await scanType('BROWSERCONNECTION#',a)).map(publicBrowserConnection);
          };
          const createBrowserConnection=async(a,body)=>{
            await authorizeIn(asPrincipal(a),'connection:manage',{orgId:a.tenantId});
            const tenantId=(asPrincipal(a).isStaff&&body.tenantId)?String(body.tenantId):a.tenantId;
            let valid;
            try{ valid=validateBrowserConnectionInput(body); }catch(err){ throw {status:400,message:err.message}; }
            const connection={id:`connection_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,tenantId,...valid,status:'pending',createdBy:a.userId,createdAt:now(),updatedAt:now()};
            await save('BROWSERCONNECTION',connection);
            return publicBrowserConnection(connection);
          };
          const requireBrowserConnection=async(a,id)=>{
            // Already tenant-partitioned for a customer (getBrowserConnection keys on the caller's own
            // organization), so the only branch that needed changing was the staff widening: it now
            // goes through the named cross-organization read, which audits.
            let connection=await getBrowserConnection(a.tenantId,id);
            if(!connection&&isStaffGroup(a.role)) connection=await resolveEntity('BROWSERCONNECTION#',id,a,'staff resolving a browser connection by id');
            if(!connection) throw {status:404,message:'Browser connection not found'};
            return connection;
          };
          // The two login routes validate everything they can -- role, that the connection exists
          // and belongs to the caller, that it is not revoked, that a session id was supplied --
          // and then refuse with 503, because driving a managed browser needs an AgentCore browser
          // this stack does not provision. Validating first matters: the caller gets the same
          // 403/404/409/400 for the same mistakes it would get from the canonical copy, and 503
          // only when the request was otherwise fine. The canonical copy behaves identically when
          // AGENTCORE_BROWSER_ID is unset, so this is the same behaviour, not a stub.
          const managedBrowserUnavailable={status:503,message:'Managed browser is not configured'};
          const startBrowserLogin=async(a,id)=>{
            await authorizeIn(asPrincipal(a),'connection:manage',{orgId:a.tenantId});
            const connection=await requireBrowserConnection(a,id);
            if(connection.status==='revoked') throw {status:409,message:'This connection has been revoked'};
            throw managedBrowserUnavailable;
          };
          const completeBrowserLogin=async(a,id,body)=>{
            await authorizeIn(asPrincipal(a),'connection:manage',{orgId:a.tenantId});
            await requireBrowserConnection(a,id);
            if(!String(body.loginSessionId||'')) throw {status:400,message:'loginSessionId is required'};
            throw managedBrowserUnavailable;
          };
          const revokeBrowserConnection=async(a,id)=>{
            await authorizeIn(asPrincipal(a),'connection:manage',{orgId:a.tenantId});
            const connection=await requireBrowserConnection(a,id);
            connection.status='revoked';
            delete connection.managedProfileId;
            connection.updatedAt=now();
            await save('BROWSERCONNECTION',connection);
            await logActivity(connection.tenantId,{actor:a.userId,actorLabel:actorLabelFor(asPrincipal(a)),action:'BROWSER_CONNECTION_REVOKED',summary:`Revoked browser connection "${connection.name}"`});
            return publicBrowserConnection(connection);
          };
          // ---------- Managed secrets (task 20.2 / 20.3) ----------
          // Requirement 20.6-20.10: name, kind, external store pointer, recognition hint, usage
          // timestamps -- never the value. The value is accepted once on write and passed straight to
          // Secrets Manager; it never enters this table, a response, a log line, or an audit event.
          const SECRET_KINDS=['api_key','bearer_token','basic_auth','oauth_refresh','webhook_secret'];
          const secretHint=(value)=>value.slice(-4);
          const externalSecretName=(tenantId,id)=>`amazflow/customer-secret/${tenantId}/${id}`;
          const publicSecret=(secret)=>{ const {ref,...safe}=secret; return safe; };
          const validateSecretInput=(body)=>{
            const name=String(body?.name??'').trim().slice(0,120);
            if(!name) throw {status:400,message:'A secret name is required'};
            const kind=String(body?.kind??'');
            if(!SECRET_KINDS.includes(kind)) throw {status:400,message:`"${kind}" is not a secret kind (available: ${SECRET_KINDS.join(', ')})`};
            const value=String(body?.value??'');
            if(!value) throw {status:400,message:'A secret value is required'};
            return {name,kind,value};
          };
          const listSecrets=async(a)=>{
            await authorizeIn(asPrincipal(a),'secret:manage',{orgId:a.tenantId});
            return (await scanType('SECRET#',a)).map(publicSecret);
          };
          const requireSecret=async(a,id)=>{
            const secret=await resolveEntity('SECRET#',id,a,'staff resolving a secret by id');
            if(!secret) throw {status:404,message:'Secret not found'};
            return secret;
          };
          const createSecret=async(a,body)=>{
            await authorizeIn(asPrincipal(a),'secret:manage',{orgId:a.tenantId});
            const valid=validateSecretInput(body);
            const id=`secret_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
            let created;
            try{ created=await secrets.send(new CreateSecretCommand({Name:externalSecretName(a.tenantId,id),SecretString:valid.value})); }catch{ throw {status:502,message:'The secret store did not accept this secret'}; }
            const record={id,tenantId:a.tenantId,name:valid.name,kind:valid.kind,ref:{provider:'aws_secretsmanager',arn:created.ARN},hint:secretHint(valid.value),createdBy:a.userId,createdAt:now(),rotatedAt:null,lastUsedAt:null};
            await save('SECRET',record);
            await logActivity(a.tenantId,{actor:a.userId,actorLabel:actorLabelFor(asPrincipal(a)),action:'SECRET_CREATED',summary:`Created secret "${record.name}"`,details:{secretId:record.id,name:record.name}});
            return publicSecret(record);
          };
          const rotateSecret=async(a,id,body)=>{
            await authorizeIn(asPrincipal(a),'secret:manage',{orgId:a.tenantId});
            const secret=await requireSecret(a,id);
            const value=String(body?.value??'');
            if(!value) throw {status:400,message:'A secret value is required'};
            try{ await secrets.send(new PutSecretValueCommand({SecretId:secret.ref.arn,SecretString:value})); }catch{ throw {status:502,message:'The secret store did not accept this rotation'}; }
            secret.hint=secretHint(value);
            secret.rotatedAt=now();
            await save('SECRET',secret);
            await logActivity(secret.tenantId,{actor:a.userId,actorLabel:actorLabelFor(asPrincipal(a)),action:'SECRET_ROTATED',summary:`Rotated secret "${secret.name}"`,details:{secretId:secret.id,name:secret.name}});
            return publicSecret(secret);
          };
          const deleteSecret=async(a,id)=>{
            await authorizeIn(asPrincipal(a),'secret:manage',{orgId:a.tenantId});
            const secret=await requireSecret(a,id);
            try{ await secrets.send(new DeleteSecretCommand({SecretId:secret.ref.arn})); }catch(err){ if(!(err&&err.name==='ResourceNotFoundException')) throw {status:502,message:'The secret store could not delete this secret'}; }
            await db.send(new DeleteItemCommand({TableName:table,Key:{pk:{S:`TENANT#${secret.tenantId}`},sk:{S:`SECRET#${secret.id}`}}}));
            await logActivity(secret.tenantId,{actor:a.userId,actorLabel:actorLabelFor(asPrincipal(a)),action:'SECRET_DELETED',summary:`Deleted secret "${secret.name}"`,details:{secretId:secret.id,name:secret.name}});
            return {id:secret.id,deleted:true};
          };
          // ---------- Support tickets ----------
          // Minimal but genuinely durable: every ticket is a real DynamoDB record any role can
          // create, SUPER_ADMIN can triage across tenants, and CLIENT_ADMIN/FRONTLINE can see
          // within the rules the rest of this file already applies to tenant-scoped data.
          const TICKET_STATUSES=['open','in_progress','resolved','closed'];
          const createTicket=async(a,body)=>{
            const subject=String(body.subject||'').trim().slice(0,200);
            const message=String(body.message||'').trim().slice(0,4000);
            if(!subject||!message) throw {status:400,message:'A subject and message are required'};
            const ticket={id:`ticket_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,tenantId:a.tenantId,createdBy:a.userId,subject,message,category:String(body.category||'general').slice(0,40),priority:['low','normal','high','urgent'].includes(body.priority)?body.priority:'normal',runId:body.runId?String(body.runId).slice(0,120):undefined,workflowId:body.workflowId?String(body.workflowId).slice(0,120):undefined,status:'open',notes:[],createdAt:now(),updatedAt:now()};
            await save('TICKET',ticket);
            await logActivity(a.tenantId,{actor:a.userId,actorLabel:actorLabelFor(asPrincipal(a)),action:'SUPPORT_TICKET_CREATED',summary:`Opened support ticket "${subject}"`});
            return ticket;
          };
          const updateTicket=async(ticketId,a,body)=>{
            const ticket=await resolveEntity('TICKET#',ticketId,a,'updating a support ticket by id');
            if(!ticket) throw {status:404,message:'Ticket not found'};
            // "Own tickets only" is the same narrowing the policy expresses: a role without
            // run:read_all does not see other people's records in its organization.
            if(!can(asPrincipal(a),'run:read_all',{orgId:ticket.tenantId}).allow&&ticket.createdBy!==a.userId) throw {status:403,message:'You can only update your own tickets'};
            if(body.status){
              if(!TICKET_STATUSES.includes(body.status)) throw {status:400,message:`status must be one of ${TICKET_STATUSES.join(', ')}`};
              ticket.status=body.status;
            }
            if(body.note){
              ticket.notes=[...(ticket.notes||[]),{id:`note_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,at:now(),by:a.userId,text:String(body.note).slice(0,2000),internal:asPrincipal(a).isStaff&&!!body.internal}];
            }
            ticket.updatedAt=now();
            await save('TICKET',ticket);
            if(body.status) await logActivity(ticket.tenantId,{actor:a.userId,actorLabel:actorLabelFor(asPrincipal(a)),action:'SUPPORT_TICKET_STATUS',summary:`Ticket "${ticket.subject}" set to ${ticket.status}`});
            return ticket;
          };

          // ---------- Workflow version history ----------
          const listWorkflowVersions=async(tenantId,workflowId)=>{
            const out=await db.send(new QueryCommand({TableName:table,KeyConditionExpression:'pk = :pk AND begins_with(sk, :prefix)',ExpressionAttributeValues:{':pk':{S:`TENANT#${tenantId}`},':prefix':{S:`WORKFLOWVERSION#${workflowId}_v`}}}));
            return (out.Items||[]).filter(i=>i.document?.S).map(parse).sort((a,b)=>(b.version||0)-(a.version||0));
          };
          /* ---------- 14.1 / 14.2 / 14.3 / 14.7 Workflow lifecycle ---------- */
          // Write a workflow and its immutable version record together (requirements 13.17, 13.18).
          // The version record is what makes a run's pin meaningful: runWorkflow stores
          // workflowVersion and every later read resolves the definition through
          // getWorkflowVersion(tenantId, workflowId, version) -- so without a version record that
          // lookup falls back to the CURRENT workflow and an in-flight run silently starts following
          // steps that were edited underneath it. Immutability here is a property of the KEY, which is
          // why every save that changes the definition bumps the version.
          const saveWorkflowWithVersion=async workflow=>{
            const next={...workflow,updatedAt:now()};
            await save('WORKFLOW',next);
            if(next.version) await save('WORKFLOWVERSION',{...next,id:`${next.id}_v${String(next.version).padStart(6,'0')}`});
            return next;
          };
          // The managed-connection availability check, RE-RUN at publish time (requirements 13.12,
          // 13.13) rather than trusted from the draft: a connection can be revoked between authoring
          // and publishing, and a managed-browser step whose connection is gone does not fail at
          // publish -- it fails at run time, against a customer's real system, having already told
          // them the workflow was live.
          const managedConnectionGapFor=async workflow=>{
            for(const step of workflow.steps||[]){
              if(!step||step.type!=='action'||step.provider!=='browser') continue;
              if(step.browserMode!=='managed') continue;
              if(!step.connectionId) return {stepId:step.id,reason:'names no connection'};
              const connection=await getBrowserConnection(workflow.tenantId,step.connectionId);
              if(!connection) return {stepId:step.id,reason:'names a connection that no longer exists'};
              if(connection.status!=='active') return {stepId:step.id,reason:`names a connection that is ${connection.status}`};
              if(!connection.managedProfileId) return {stepId:step.id,reason:'names a connection that has never been signed in'};
            }
            return null;
          };
          // resolveEntity partitions the read for a non-staff principal, so another organization's
          // identifier is simply NOT FOUND -- no comparison to get wrong, no 403 existence oracle.
          const resolveWorkflow=async(id,p,reason)=>resolveEntity('WORKFLOW#',id,p,reason);
          // The audit event each transition records (requirement 13.23), one per transition.
          const WORKFLOW_TRANSITION_AUDIT={active:'WORKFLOW_PUBLISHED',draft:'WORKFLOW_UNPUBLISHED',archived:'WORKFLOW_ARCHIVED',testing:'WORKFLOW_STATUS_CHANGED'};
          // The allowlisted filter field set (requirements 13.6, 13.7). An unrecognized field is
          // REFUSED rather than ignored: a client asking for ?state=draft and being handed the
          // unfiltered list has been told, by the shape of a successful response, that every workflow
          // it received is a draft.
          const WORKFLOW_FILTER_FIELDS=['q','status','provider','surface','assignedRole'];
          const workflowMatchesFilters=(workflow,filters)=>{
            if(filters.q){
              const needle=filters.q.toLowerCase();
              const haystack=[workflow.name,workflow.description,workflow.customerSummary].filter(value=>typeof value==='string').join(' ').toLowerCase();
              if(!haystack.includes(needle)) return false;
            }
            // Compared against the DISPLAY status so filtering for Archived also returns the legacy
            // 'paused' records the list shows as Archived. Filtering on the stored value would show a
            // person a workflow labelled Archived that their own Archived filter then hides.
            if(filters.status){
              const shown=workflow.status==='paused'?'archived':workflow.status;
              if(shown!==filters.status) return false;
            }
            if(filters.provider){
              const providers=new Set((workflow.steps||[]).filter(step=>step&&step.type==='action'&&step.provider).map(step=>step.provider));
              if(!providers.has(filters.provider)) return false;
            }
            if(filters.surface&&!requiredSurfacesFor(workflow).includes(filters.surface)) return false;
            if(filters.assignedRole){
              const assigned=Array.isArray(workflow.assignedRoles)?workflow.assignedRoles:[];
              if(!assigned.includes(filters.assignedRole)) return false;
            }
            return true;
