AWSTemplateFormatVersion: '2010-09-09'
Description: AmazFlow control plane with tenant-scoped RBAC and bounded AI execution

Parameters:
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Amazon Bedrock model used for bounded workflow AI steps and AmazFlow Copilot
  BedrockFoundationModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-6
    Description: Foundation model granted to the Lambda role. Matches BedrockModelId for a
      directly-invokable model; differs only when BedrockModelId is a cross-region inference
      profile (e.g. us.anthropic.*), which is not entitled on this account today.
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [development, production]
  ExecutionGrantSecret:
    Type: String
    NoEcho: true
    Default: 9cdf5cf763984a9e4b99dd16d5c6c12c296fbf37bad582138e44e5d97f2b3139
    Description: HMAC secret signing AgentCore execution grants (v1 format, matches packages/engine/src/execution-grant.ts). Dev/staging secret baked into the template; move to Secrets Manager before this path carries real customer actions.
  ExecutorHarnessArn:
    Type: String
    Default: arn:aws:bedrock-agentcore:us-east-1:398681517793:harness/harness_pwphl-y67Z8PxUwD
    Description: AgentCore Harness the control plane invokes as the AmazFlow Executor for agentcore-backed action steps
  DataBoundary:
    Type: String
    Default: production-non-regulated
    AllowedValues: [synthetic-only, production-non-regulated]
    Description: Production allows live operational data but not PHI, payment data, or other regulated data

Resources:
  ControlPlaneTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      Tags:
        - { Key: Product, Value: AmazFlow }
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: DataBoundary, Value: !Ref DataBoundary }

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: amazflow-dev-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          Required: false

  FrontlineGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: FRONTLINE, Description: Runs assigned workflows and views own executions, UserPoolId: !Ref UserPool, Precedence: 30 }
  ClientAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: CLIENT_ADMIN, Description: Runs tenant workflows and manages tenant operations, UserPoolId: !Ref UserPool, Precedence: 20 }
  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: SUPER_ADMIN, Description: AmazFlow-owned global configuration and tenant administration, UserPoolId: !Ref UserPool, Precedence: 10 }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: amazflow-dev-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      # ALLOW_USER_PASSWORD_AUTH lets the branded /login page authenticate directly against
      # Cognito's InitiateAuth API (password sent over TLS) instead of redirecting through the
      # Cognito Hosted UI -- the tradeoff for never showing AWS/Cognito branding, and for not
      # needing an SRP client-side crypto library. Not a downgrade from the (still enabled) SRP
      # flow's own security level in any way that matters over TLS; it's simply a different,
      # equally AWS-supported flow.
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: ['https://amazflow.com/app/', 'https://amazflow.com/console/']
      LogoutURLs: ['https://amazflow.com/app/', 'https://amazflow.com/console/']
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: amazflow-dev-398681517793
      UserPoolId: !Ref UserPool

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: amazflow-dev-control-plane
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
                Resource: !GetAtt ControlPlaneTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: '*'
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
              - Effect: Allow
                # Broad resource scope matches the pattern AgentCore itself uses for these actions
                # (no resource-level ARN restriction is currently supported for InvokeHarness) --
                # tenant/workflow/run scoping is enforced by the execution grant, not by IAM here.
                Action: [bedrock-agentcore:InvokeHarness, bedrock-agentcore:InvokeAgentRuntime]
                Resource: '*'
              - Effect: Allow
                # ListUsersInGroup isn't in the master prompt's Phase 5 list but is required to resolve
                # each Cognito user's AmazFlow role (group membership isn't returned by ListUsers itself).
                #
                # AdminCreateUser + AdminAddUserToGroup are the invite flow that AdminAddUserToGroup
                # was originally reserved for. AdminGetUser reads back the invitation state so the
                # console can show who has accepted. Deliberately NOT granted: AdminDeleteUser and
                # AdminSetUserPassword. Removing a person is done by disabling them, which is
                # reversible and leaves their audit trail attributable, and no operator route should
                # be able to set a customer's password.
                Action: [cognito-idp:ListUsers, cognito-idp:ListUsersInGroup, cognito-idp:AdminEnableUser, cognito-idp:AdminDisableUser, cognito-idp:AdminAddUserToGroup, cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser]
                Resource: !GetAtt UserPool.Arn

  ControlPlaneFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: amazflow-dev-control-plane
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref ControlPlaneTable
          USER_POOL_ID: !Ref UserPool
          DATA_BOUNDARY: !Ref DataBoundary
          # sales@amazflow.com is not a verified SES identity and the account is still in the SES
          # sandbox (verified sender AND recipient required, amazflow.com domain verification is
          # pending), so a send to/from it fails silently -- this caught every lead the form has
          # captured since the account was created. hello@amazflow.com is the one identity that's
          # actually verified. Move both back to a dedicated sales@ address once the domain
          # verifies or SES production access is granted.
          LEAD_TO: hello@amazflow.com
          LEAD_FROM: hello@amazflow.com
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EXECUTION_GRANT_SECRET: !Ref ExecutionGrantSecret
          EXECUTOR_HARNESS_ARN: !Ref ExecutorHarnessArn
      Code:
        ZipFile: |
          const crypto=require('crypto');
          const {DynamoDBClient,ScanCommand,QueryCommand,PutItemCommand,GetItemCommand,TransactWriteItemsCommand}=require('@aws-sdk/client-dynamodb');
          const {BedrockRuntimeClient,ConverseCommand}=require('@aws-sdk/client-bedrock-runtime');
          const {SESv2Client,SendEmailCommand}=require('@aws-sdk/client-sesv2');
          const {CognitoIdentityProviderClient,ListUsersCommand,ListUsersInGroupCommand,AdminEnableUserCommand,AdminDisableUserCommand,AdminCreateUserCommand,AdminAddUserToGroupCommand}=require('@aws-sdk/client-cognito-identity-provider');
          const db=new DynamoDBClient({}); const bedrock=new BedrockRuntimeClient({}); const ses=new SESv2Client({}); const cognito=new CognitoIdentityProviderClient({}); const table=process.env.TABLE_NAME;
          const reply=(s,b)=>({statusCode:s,headers:{'content-type':'application/json','access-control-allow-origin':'*'},body:JSON.stringify(b)});
          // API Gateway's JWT authorizer forwards the cognito:groups claim as the literal
          // string "[GROUP1, GROUP2]" (brackets included as characters), not a clean
          // comma list and not a real array -- strip the brackets before splitting.
          const auth=e=>{const c=e.requestContext?.authorizer?.jwt?.claims||{};const groups=String(c['cognito:groups']||'').replace(/^\[|\]$/g,'').split(',').map(g=>g.trim());const role=['SUPER_ADMIN','CLIENT_ADMIN','FRONTLINE'].find(r=>groups.includes(r));return {userId:c.sub,tenantId:c['custom:tenant_id'],role};};
          const parse=i=>JSON.parse(i.document.S); const now=()=>new Date().toISOString();
          const ai=async(step,context)=>{const allowed=Array.isArray(step.allowedValues)?step.allowedValues.map(String):[];const system='You are a bounded operations workflow component. Never choose or invent tools. Return JSON with keys "value" and "confidence" (required, confidence between 0 and 1), plus any other field the instruction below explicitly asks you to extract -- omit fields it does not ask for.';const prompt=`Operation: ${step.operation}\nInstruction: ${step.prompt}\nAllowed values: ${allowed.length?allowed.join(', '):'not restricted'}\nContext: ${JSON.stringify(context||{})}`;const out=await bedrock.send(new ConverseCommand({modelId:process.env.BEDROCK_MODEL_ID,system:[{text:system}],messages:[{role:'user',content:[{text:prompt}]}],inferenceConfig:{maxTokens:800,temperature:0}}));let text=out.output?.message?.content?.find(x=>x.text)?.text||'{}';text=text.replace(/^```json\s*|\s*```$/g,'');const result=JSON.parse(text);if(typeof result.confidence!=='number'||result.confidence<0||result.confidence>1)throw new Error('Invalid AI confidence');if(allowed.length&&!allowed.includes(String(result.value)))throw new Error('AI returned value outside allowlist');return {result,usage:out.usage};};
          // Baseline SSRF guard for autonomous api-provider actions: block obviously
          // internal/metadata targets. Not exhaustive (no DNS-rebinding protection) but a
          // reasonable floor given only SUPER_ADMIN authors workflows today.
          const isUnsafeUrl=(urlStr)=>{
            try{
              const u=new URL(urlStr);
              if(u.protocol!=='https:'&&u.protocol!=='http:') return true;
              const host=u.hostname;
              if(/^(127\.|10\.|169\.254\.|192\.168\.|0\.0\.0\.0|localhost)/i.test(host)) return true;
              if(/^172\.(1[6-9]|2\d|3[01])\./.test(host)) return true;
              return false;
            }catch{return true;}
          };
          // Shared shape validation for both the AI-generation path and the hand-edited-JSON
          // save path (POST /workflows previously only checked 4 top-level fields and let
          // anything through underneath -- a typo'd provider or a dangling step reference
          // would silently save). Returns null when valid, or a specific error string.
          const VALID_STEP_TYPES=['ai','action','condition','approval','verify','end'];
          const VALID_PROVIDERS=['browser','desktop','api','spreadsheet','email','file','mock'];
          const validateWorkflowShape=(draft)=>{
            if(!draft||typeof draft!=='object') return 'Workflow must be an object';
            if(!draft.id||!draft.tenantId||!draft.name||!draft.startAt) return 'Missing id, tenantId, name, or startAt';
            if(!Array.isArray(draft.steps)||draft.steps.length===0) return 'steps must be a non-empty array';
            const ids=new Set(draft.steps.map(s=>s&&s.id));
            if(!ids.has(draft.startAt)) return `startAt "${draft.startAt}" does not match any step id`;
            for(const step of draft.steps){
              if(!step||!step.id||!step.type) return 'Every step needs an id and a type';
              if(!VALID_STEP_TYPES.includes(step.type)) return `Step "${step.id}" has invalid type "${step.type}" (must be one of ${VALID_STEP_TYPES.join(', ')})`;
              if(step.type==='action'&&!VALID_PROVIDERS.includes(step.provider)) return `Step "${step.id}" has invalid provider "${step.provider}" (must be one of ${VALID_PROVIDERS.join(', ')})`;
              const refs=[step.next,step.type==='condition'?step.whenTrue:undefined,step.type==='condition'?step.whenFalse:undefined,step.type==='approval'?step.onReject:undefined,step.type==='verify'?step.onFailure:undefined].filter(Boolean);
              for(const ref of refs) if(!ids.has(ref)) return `Step "${step.id}" references missing step "${ref}"`;
            }
            return null;
          };
          const generateWorkflowFromSop=async(sop,tenantId)=>{
            const system='You design AmazFlow workflow definitions as JSON. A workflow has: id, tenantId, name, description, version, status, dataClass, assignedRoles (array of FRONTLINE/CLIENT_ADMIN/SUPER_ADMIN), startAt, allowedProviders, steps. Each step has a unique id, name, and type: "ai" (operation, prompt, outputKey, allowedValues?, confidenceThreshold?, next), "condition" (path, operator: equals|notEquals|exists|gt|lt, value, whenTrue, whenFalse), "approval" (message, roles, next, onReject?), "action" (provider: browser|api|spreadsheet|email|file|mock -- ONLY these six exact strings, never invent another provider name, next), "verify" (path, operator, value, next, onFailure?), or "end" (outcome: success|failed). Every step id referenced by next/whenTrue/whenFalse/onReject/onFailure must exist in steps, and every path traced from startAt must reach an end step. Put a human approval step before any high-impact action (access changes, financial actions, deletions, anything hard to undo). Return ONLY the JSON object -- no prose, no markdown fences.';
            const basePrompt=`Design a workflow for this standard operating procedure:\n${sop}\n\nUse tenantId "${tenantId}". Set status to "draft". Use a short kebab-case id starting with "workflow-".`;
            let lastError;
            for(let attempt=0;attempt<2;attempt++){
              const prompt=attempt===0?basePrompt:`${basePrompt}\n\nYour previous attempt was invalid: ${lastError}. Fix that specific problem and return the corrected JSON object.`;
              const out=await bedrock.send(new ConverseCommand({modelId:process.env.BEDROCK_MODEL_ID,system:[{text:system}],messages:[{role:'user',content:[{text:prompt}]}],inferenceConfig:{maxTokens:3000,temperature:0.2}}));
              let text=out.output?.message?.content?.find(x=>x.text)?.text||'{}';
              text=text.replace(/^```json\s*|\s*```$/g,'').trim();
              let draft;
              try{draft=JSON.parse(text);}catch{lastError='Response was not valid JSON';continue;}
              draft.tenantId=tenantId; draft.status='draft'; draft.version=1;
              if(!draft.id) draft.id=`workflow-${Date.now().toString(36)}`;
              const shapeError=validateWorkflowShape(draft);
              if(!shapeError) return draft;
              lastError=shapeError;
            }
            throw new Error(`Could not generate a valid workflow: ${lastError}`);
          };
          const valueAt=(obj,path)=>{const keys=String(path||'').split('.');const read=root=>keys.reduce((v,k)=>v?.[k],root);const direct=read(obj);return direct===undefined?read(obj?.values):direct;};const test=(left,op,right)=>op==='equals'?left===right:op==='notEquals'?left!==right:op==='exists'?left!==undefined:op==='gt'?left>right:op==='lt'?left<right:false;
          // Resolves {{dotted.path}} placeholders in a step's input against the run's own
          // context (customer's original request plus whatever earlier AI/condition steps have
          // extracted) before it's ever sent to a browser agent. Without this, an action step's
          // input is the same static object no matter what the customer actually asked for or
          // what an earlier step observed -- which is also what would make a real strong-
          // identifier check (see SET_EMPLOYEE_STATUS in the agent) impossible, since there'd be
          // no way to carry a specific record's id from the request into the task the agent runs.
          const interpolate=(value,context)=>{
            if(typeof value==='string') return value.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(_,path)=>{const resolved=valueAt(context,path);return resolved===undefined?'':String(resolved);});
            if(Array.isArray(value)) return value.map(v=>interpolate(v,context));
            if(value&&typeof value==='object'){const out={};for(const k of Object.keys(value)) out[k]=interpolate(value[k],context);return out;}
            return value;
          };
          const PAGE_GUARD=200;
          // DynamoDB caps a Scan/Query page at 1 MB and returns LastEvaluatedKey for the rest.
          // Discarding that key does not read less -- it reads the WRONG thing: by-id lookups
          // layered on top begin 404ing once the table exceeds one page, and the expiry sweep
          // silently stops seeing the records it exists to expire. Drain every page.
          const scanType=async(type,a)=>{
            const items=[];let cursor;let pages=0;
            if(a.role==='SUPER_ADMIN'){
              // Cross-tenant SUPER_ADMIN reads still Scan: there's no cross-tenant GSI yet.
              // Accepted tradeoff at current scale -- add a GSI if the operator's own views get slow.
              do{
                const out=await db.send(new ScanCommand({TableName:table,ExclusiveStartKey:cursor}));
                for(const i of (out.Items||[])){if(i.sk?.S?.startsWith(type)&&i.document?.S)items.push(parse(i));}
                cursor=out.LastEvaluatedKey;
              }while(cursor&&++pages<PAGE_GUARD);
            }else{
              do{
                const out=await db.send(new QueryCommand({TableName:table,KeyConditionExpression:'pk = :pk AND begins_with(sk, :prefix)',ExpressionAttributeValues:{':pk':{S:`TENANT#${a.tenantId}`},':prefix':{S:type}},ExclusiveStartKey:cursor}));
                for(const i of (out.Items||[])){if(i.document?.S)items.push(parse(i));}
                cursor=out.LastEvaluatedKey;
              }while(cursor&&++pages<PAGE_GUARD);
            }
            if(cursor){console.error(JSON.stringify({level:'error',event:'SCAN_TRUNCATED',type,pages,message:'Paged read hit PAGE_GUARD; results are incomplete'}));}
            return items;
          };
          const save=async(type,doc)=>db.send(new PutItemCommand({TableName:table,Item:{pk:{S:`TENANT#${doc.tenantId}`},sk:{S:`${type}#${doc.id}`},tenantId:{S:doc.tenantId},document:{S:JSON.stringify(doc)},updatedAt:{S:now()}}}));
          // Organizations (customer tenants) live in a shared PLATFORM partition rather than a
          // TENANT# partition, since listing them is a platform-level (SUPER_ADMIN) operation
          // across all customers, not a single tenant's own data.
          const slugify=(name)=>String(name||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);
          const listOrganizations=async()=>{
            const out=await db.send(new QueryCommand({TableName:table,KeyConditionExpression:'pk = :pk AND begins_with(sk, :prefix)',ExpressionAttributeValues:{':pk':{S:'PLATFORM'},':prefix':{S:'ORG#'}}}));
            return (out.Items||[]).filter(i=>i.document?.S).map(parse);
          };
          const getOrganization=async(slug)=>{
            const out=await db.send(new QueryCommand({TableName:table,KeyConditionExpression:'pk = :pk AND sk = :sk',ExpressionAttributeValues:{':pk':{S:'PLATFORM'},':sk':{S:`ORG#${slug}`}}}));
            const item=(out.Items||[])[0];
            return item&&item.document?.S?parse(item):null;
          };
          const saveOrganization=async(org)=>db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`ORG#${org.slug}`},document:{S:JSON.stringify(org)},updatedAt:{S:now()}}}));
          // Browser Agent authorization: replaces the DevTools-token-copy flow. A human (signed
          // in with a real Cognito JWT) creates the agent record and a short-lived one-time code
          // via POST /agent-authorizations; the extension itself never sees that JWT. It opens a
          // browser tab to /agent-authorize, and once the human approves, the extension picks up
          // the resulting code from the tab URL and exchanges it (POST .../exchange, no auth
          // required for that one call, same as how an OAuth authorization code works) for an
          // opaque, hashed-at-rest, agent-scoped, tenant-scoped, revocable bearer token -- never
          // a copy of anyone's real session. Codes and credentials live in the flat PLATFORM
          // partition (like Organizations) since a bare code/token string carries no tenant
          // context until looked up.
          const hashToken=(token)=>crypto.createHash('sha256').update(token).digest('hex');
          // Signed execution grant -- same wire format as packages/engine/src/execution-grant.ts
          // (v1.<base64url json>.<base64url hmac-sha256>), so this Lambda and that package can
          // mint/verify interchangeably. The Executor reasons about whether an action looks
          // right; this is the actual authorization boundary -- the model never sees the secret,
          // can't mint or extend a grant, and every field is checked independently of what the
          // model claims about itself.
          const GRANT_TTL_SECONDS=300;
          const b64u=(v)=>Buffer.from(v,'utf8').toString('base64url');
          const unb64u=(v)=>Buffer.from(v,'base64url').toString('utf8');
          const signGrant=(encodedPayload)=>crypto.createHmac('sha256',process.env.EXECUTION_GRANT_SECRET).update(`v1.${encodedPayload}`).digest('base64url');
          const mintExecutionGrant=({runId,tenantId,workflowId,workflowVersion,stepId,allowedTools,confirmationGranted,taskId,agentId,agentType,executionTarget,actionType,destination})=>{
            const issuedAt=Math.floor(Date.now()/1000);
            const payload={version:1,grantId:crypto.randomUUID(),runId,tenantId,workflowId,workflowVersion,stepId,allowedTools,confirmationGranted:!!confirmationGranted,taskId:taskId||null,agentId:agentId||null,agentType:agentType||null,executionTarget:executionTarget||null,actionType:actionType||null,destination:destination||null,issuedAt,expiresAt:issuedAt+GRANT_TTL_SECONDS};
            const encoded=b64u(JSON.stringify(payload));
            return `v1.${encoded}.${signGrant(encoded)}`;
          };
          // Independently verifies signature, expiry, every scope field against what the caller
          // separately loaded from the database (never against what the request body claims),
          // and single-use via a conditional DynamoDB put keyed by grantId. Throws on any
          // mismatch -- callers must not catch-and-continue.
          const verifyExecutionGrant=async(token,expected)=>{
            const parts=typeof token==='string'?token.split('.'):[];
            const [version,encoded,signature,extra]=parts;
            if(version!=='v1'||!encoded||!signature||extra) throw {status:400,message:'Malformed execution grant'};
            const actual=Buffer.from(signature,'base64url');
            const wanted=Buffer.from(signGrant(encoded),'base64url');
            if(actual.length!==wanted.length||!crypto.timingSafeEqual(actual,wanted)) throw {status:401,message:'Invalid execution grant signature'};
            let payload;
            try{ payload=JSON.parse(unb64u(encoded)); }catch{ throw {status:400,message:'Malformed execution grant payload'}; }
            if(payload.version!==1) throw {status:400,message:'Unsupported execution grant version'};
            if(!payload.expiresAt||payload.expiresAt<=Math.floor(Date.now()/1000)) throw {status:401,message:'Execution grant expired'};
            // Every bound field is compared against records the caller loaded separately, so a
            // desktop agent cannot present a browser step's grant, and neither can act outside the
            // one task, step, action and destination the grant was minted for.
            for(const key of ['runId','tenantId','workflowId','workflowVersion','stepId','taskId','agentId','agentType','executionTarget','actionType']){
              if(expected[key]!==undefined&&payload[key]!==expected[key]) throw {status:403,message:`Execution grant ${key} mismatch`};
            }
            if(expected.tool&&!(Array.isArray(payload.allowedTools)&&payload.allowedTools.includes(expected.tool))) throw {status:403,message:'Tool is not authorized by this execution grant'};
            // Single-use is keyed by (grantId, tool) rather than grantId alone. One grant names
            // a set of tools and authorizes each of them exactly once, which is what lets a
            // single claim's grant carry both the agent's record_step_result evidence write and
            // its one terminal result submission while leaving either call unreplayable. A grant
            // naming one tool behaves exactly as before.
            const useKey=`GRANT#${payload.grantId}#${expected.tool||'*'}`;
            try{
              await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:useKey},document:{S:'consumed'},updatedAt:{S:now()},ttl:{N:String(payload.expiresAt+3600)}},ConditionExpression:'attribute_not_exists(pk)'}));
            }catch(err){
              if(err.name==='ConditionalCheckFailedException') throw {status:409,message:'Execution grant was already used for this tool'};
              throw err;
            }
            return payload;
          };
          // installationId identifies one browser profile. Re-authorizing the same browser -- after a
          // sign-out, an expired session, or a restart -- reuses that browser's agent record instead
          // of minting another one. Without this every reconnect left another "Never connected"
          // agent behind, which is what the agent list had filled up with.
          const createAgentAndCode=async(tenantId,name,allowedDomains,createdBy,userRole,installationId,profile)=>{
            let agent=null;
            if(installationId){
              const existing=await scanType('AGENT#',{role:'SUPER_ADMIN'});
              agent=existing.find(a=>a.tenantId===tenantId&&a.installationId===installationId&&a.createdBy===createdBy)||null;
            }
            if(agent){
              // Superseding this browser's own credential: any token previously issued to this agent
              // is retired here, so a reconnect never leaves an extra live credential behind.
              const creds=await scanType('AGENTCRED#',{role:'SUPER_ADMIN'});
              for(const cred of creds){
                if(cred.agentId!==agent.id||cred.status!=='active'||!cred.tokenHash) continue;
                cred.status='superseded';
                cred.supersededAt=now();
                await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`AGENTCRED#${cred.tokenHash}`},document:{S:JSON.stringify(cred)},updatedAt:{S:now()}}}));
              }
              agent.name=name||agent.name;
              agent.status='active';
              agent.updatedAt=now();
            } else {
              agent={id:`agent_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,tenantId,name,allowedDomains:Array.isArray(allowedDomains)?allowedDomains:[],status:'active',createdBy,installationId:installationId||null,createdAt:now(),updatedAt:now(),lastSeenAt:null,version:null};
            }
            if(profile){
              agent.agentType=profile.agentType==='DESKTOP_AGENT'?'DESKTOP_AGENT':'CHROME_EXTENSION';
              agent.capabilities=Array.isArray(profile.capabilities)?profile.capabilities.filter(c=>typeof c==='string').slice(0,60):[];
              agent.platform=typeof profile.platform==='string'?profile.platform.slice(0,80):null;
              agent.version=typeof profile.version==='string'?profile.version.slice(0,40):agent.version;
            }
            if(!agent.agentType) agent.agentType='CHROME_EXTENSION';
            await save('AGENT',agent);
            const code=crypto.randomBytes(24).toString('hex');
            const settings=await getSettings();
            const codeDoc={code,agentId:agent.id,tenantId,userId:createdBy,userRole,status:'PENDING',createdAt:now(),expiresAt:new Date(Date.now()+settings.agentCodeExpiryMs).toISOString()};
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`AGENTCODE#${code}`},document:{S:JSON.stringify(codeDoc)},updatedAt:{S:now()}}}));
            return {agent,code};
          };
          const exchangeAgentCode=async(code)=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:'PLATFORM'},sk:{S:`AGENTCODE#${code}`}}}));
            if(!out.Item||!out.Item.document?.S) throw {status:404,message:'Invalid or expired authorization code'};
            const codeDoc=JSON.parse(out.Item.document.S);
            if(codeDoc.status!=='PENDING') throw {status:409,message:'This code has already been used'};
            if(new Date(codeDoc.expiresAt).getTime()<Date.now()) throw {status:409,message:'This code has expired'};
            codeDoc.status='USED';
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`AGENTCODE#${code}`},document:{S:JSON.stringify(codeDoc)},updatedAt:{S:now()}}}));
            const token=crypto.randomBytes(32).toString('hex');
            const cred={agentId:codeDoc.agentId,tenantId:codeDoc.tenantId,userId:codeDoc.userId,userRole:codeDoc.userRole,tokenHash:hashToken(token),createdAt:now(),status:'active'};
            await db.send(new PutItemCommand({TableName:table,Item:{pk:{S:'PLATFORM'},sk:{S:`AGENTCRED#${hashToken(token)}`},document:{S:JSON.stringify(cred)},updatedAt:{S:now()}}}));
            const agentOut=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:`TENANT#${codeDoc.tenantId}`},sk:{S:`AGENT#${codeDoc.agentId}`}}}));
            const agentName=agentOut.Item&&agentOut.Item.document?.S?JSON.parse(agentOut.Item.document.S).name:null;
            return {token,agentId:codeDoc.agentId,agentName,tenantId:codeDoc.tenantId,userId:codeDoc.userId,userRole:codeDoc.userRole};
          };
          // Validates the extension's own bearer token (never a Cognito JWT) for the /agent/*
          // routes, which run with AuthorizationType NONE at the gateway for exactly this reason.
          const agentAuth=async(e)=>{
            const token=e.headers?.['x-amazflow-agent-token']||e.headers?.['X-AmazFlow-Agent-Token'];
            if(!token) throw {status:401,message:'Missing agent token'};
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:'PLATFORM'},sk:{S:`AGENTCRED#${hashToken(token)}`}}}));
            if(!out.Item||!out.Item.document?.S) throw {status:401,message:'Invalid agent token'};
            const cred=JSON.parse(out.Item.document.S);
            if(cred.status!=='active') throw {status:401,message:cred.status==='superseded'?'This browser was reconnected. Sign in again from the AmazFlow extension.':'This agent credential has been revoked'};
            const agentOut=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:`TENANT#${cred.tenantId}`},sk:{S:`AGENT#${cred.agentId}`}}}));
            if(!agentOut.Item||!agentOut.Item.document?.S) throw {status:401,message:'Agent not found'};
            const agent=JSON.parse(agentOut.Item.document.S);
            if(agent.status!=='active') throw {status:401,message:'This agent has been revoked'};
            if(!cred.userRole) throw {status:401,message:'This agent was authorized before per-user scoping. Reconnect it from the AmazFlow console.'};
            return {agentId:cred.agentId,tenantId:cred.tenantId,userId:cred.userId,userRole:cred.userRole,agent};
          };
          // Server-side authorization for agent-delivered work. The extension also filters, but
          // that is a convenience only -- the agent token lives in the browser, so anything not
          // enforced here is not enforced at all. Mirrors the same rules the human-facing routes
          // use: super admins see the whole tenant, other roles only see work for workflows
          // assigned to their role, and FRONTLINE additionally only sees runs they started.
          const AGENT_TYPE_FOR_TARGET={browser_extension:'CHROME_EXTENSION',desktop_agent:'DESKTOP_AGENT'};
          // An agent may only see work its own surface can carry out. The execution target on the
          // task decides which agent type is eligible, and the capability list the agent advertised
          // at registration decides whether this particular build implements the action -- so an
          // older agent is passed over instead of claiming work it would fail.
          const agentMayRunTask=(task,ctx)=>{
            if(task.tenantId!==ctx.tenantId) return false;
            const target=task.executionTarget||'browser_extension';
            const agentType=ctx.agent&&ctx.agent.agentType?ctx.agent.agentType:'CHROME_EXTENSION';
            if(AGENT_TYPE_FOR_TARGET[target]!==agentType) return false;
            const capabilities=Array.isArray(ctx.agent&&ctx.agent.capabilities)?ctx.agent.capabilities:null;
            if(capabilities&&!capabilities.includes(task.operation)) return false;
            if(ctx.userRole==='SUPER_ADMIN') return true;
            const assigned=Array.isArray(task.assignedRoles)?task.assignedRoles:[];
            if(!assigned.includes(ctx.userRole)) return false;
            if(ctx.userRole==='FRONTLINE'&&task.createdBy&&task.createdBy!==ctx.userId) return false;
            return true;
          };
          // A task lease. Before this, every connected browser in a tenant polled the same
          // PENDING task list and simply acted on the first entry -- two agents open on the same
          // tenant both performed the same click, and whichever reported second got a 409 after
          // the side effect had already happened twice. Claiming is now a conditional,
          // single-winner write on a separate lock item (the same pattern the grant's own
          // single-use check uses), and the lock self-heals: a lease older than its expiry can be
          // taken over, so an agent that crashes mid-step doesn't strand the run.
          const acquireTaskLease=async(taskId,agentId,leaseExpiresAtMs)=>{
            try{
              await db.send(new PutItemCommand({
                TableName:table,
                Item:{pk:{S:'PLATFORM'},sk:{S:`TASKCLAIM#${taskId}`},document:{S:JSON.stringify({taskId,agentId,claimedAt:now()})},leaseExpiresAtMs:{N:String(leaseExpiresAtMs)},updatedAt:{S:now()},ttl:{N:String(Math.floor(leaseExpiresAtMs/1000)+86400)}},
                ConditionExpression:'attribute_not_exists(pk) OR leaseExpiresAtMs < :nowMs',
                ExpressionAttributeValues:{':nowMs':{N:String(Date.now())}}
              }));
            }catch(err){
              if(err.name==='ConditionalCheckFailedException') throw {status:409,message:'Another agent is already running this task'};
              throw err;
            }
          };
          // The only place a browser-path execution grant is minted. The agent's bearer token
          // proves which agent is calling; it is deliberately NOT what authorizes the action --
          // that token sits in a browser profile and is long-lived. The grant is: it is bound to
          // this exact run, workflow version and step, names the two tools the agent may call,
          // is single-use per tool, and expires in minutes. Everything the grant asserts is
          // checked on the way back in against records loaded from the database, never against
          // anything the agent re-sends.
          const claimAgentTask=async(taskId,agentCtx)=>{
            const allTasks=await scanType('TASK#',{role:'SUPER_ADMIN'});
            const task=allTasks.find(t=>t.id===taskId);
            if(!task||!agentMayRunTask(task,agentCtx)) throw {status:404,message:'Task not found'};
            if(!ALLOWED_AGENT_OPS.has(task.operation)) throw {status:400,message:'Operation is not in the allowed agent operation set'};
            if(new Date(task.expiresAt).getTime()<Date.now()) throw {status:409,message:'This task has expired'};
            if(task.status==='CLAIMED'&&task.claimExpiresAt&&new Date(task.claimExpiresAt).getTime()>=Date.now()) throw {status:409,message:'Another agent is already running this task'};
            if(task.status!=='PENDING'&&task.status!=='CLAIMED') throw {status:409,message:'Task already resolved'};
            const allRuns=await scanType('RUN#',{role:'SUPER_ADMIN'});
            const run=allRuns.find(r=>r.id===task.runId);
            if(!run||run.status!=='WAITING_AGENT'||run.currentStepId!==task.stepId) throw {status:409,message:'Run is not waiting for this task'};
            const workflow=await getWorkflowVersion(run.tenantId,run.workflowId,run.workflowVersion);
            if(!workflow) throw {status:400,message:'Workflow not found for run'};
            const step=(workflow.steps||[]).find(s=>s.id===task.stepId);
            if(!step) throw {status:409,message:'Step is no longer part of the workflow version this run started on'};
            const leaseExpiresAtMs=Date.now()+GRANT_TTL_SECONDS*1000;
            await acquireTaskLease(task.id,agentCtx.agentId,leaseExpiresAtMs);
            const confirmationGranted=Array.isArray(run.confirmedStepIds)&&run.confirmedStepIds.includes(task.stepId);
            const grant=mintExecutionGrant({runId:run.id,tenantId:run.tenantId,workflowId:run.workflowId,workflowVersion:run.workflowVersion,stepId:task.stepId,allowedTools:['record_step_result','agent.report_result'],confirmationGranted,taskId:task.id,agentId:agentCtx.agentId,agentType:agentCtx.agent&&agentCtx.agent.agentType?agentCtx.agent.agentType:'CHROME_EXTENSION',executionTarget:task.executionTarget||'browser_extension',actionType:task.operation,destination:task.destination||null});
            const grantId=JSON.parse(unb64u(grant.split('.')[1])).grantId;
            task.status='CLAIMED';
            task.claimedBy=agentCtx.agentId;
            task.claimedAt=now();
            task.claimExpiresAt=new Date(leaseExpiresAtMs).toISOString();
            task.grantId=grantId;
            await save('TASK',task);
            const auditStartIdx=run.audit.length;
            run.audit.push({id:`aud_${run.audit.length+1}`,at:now(),type:'AGENT_TASK_CLAIMED',stepId:task.stepId,message:`Browser agent claimed ${task.operation} for ${task.stepId}`,details:{taskId:task.id,agentId:agentCtx.agentId,grantId,expiresAt:task.claimExpiresAt}});
            run.updatedAt=now();
            await saveRunWithAudit(run,auditStartIdx);
            // The agent UIs show people what is happening, and people do not think in run ids,
            // step ids or operation names. The server already knows the workflow and step by name,
            // so it sends those rather than leaving each agent to render internals.
            const stepIndex=(workflow.steps||[]).filter(x=>x.type!=='end').findIndex(x=>x.id===task.stepId);
            const stepCount=(workflow.steps||[]).filter(x=>x.type!=='end').length;
            return {task,grant,grantId,runId:run.id,stepId:task.stepId,workflowId:run.workflowId,claimExpiresAt:task.claimExpiresAt,verify:step.verify||null,executionTarget:task.executionTarget||'browser_extension',destination:task.destination||null,
              display:{workflowName:workflow.name,stepName:step.name,stepNumber:stepIndex>=0?stepIndex+1:null,stepCount:stepCount||null}};
          };
          const touchAgentHeartbeat=async(agentId,tenantId,version,capabilities,permissions)=>{
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:`TENANT#${tenantId}`},sk:{S:`AGENT#${agentId}`}}}));
            if(!out.Item||!out.Item.document?.S) return;
            const agent=JSON.parse(out.Item.document.S);
            agent.lastSeenAt=now();
            if(version) agent.version=version;
