  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: amazflow-dev-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['https://amazflow.com', 'https://www.amazflow.com']
        # Aligned with the methods the declared routes actually use. This list said
        # [GET, POST, OPTIONS] while PUT /organizations/{slug} already existed, so that route was
        # unreachable from a browser -- the preflight was refused before the request was made.
        # DELETE is needed by the browser-connection route ported in Phase 0b. A route that exists
        # but cannot be called is the same class of defect as a route that only exists in one copy.
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ControlPlaneFunction.Arn
      PayloadFormatVersion: '2.0'

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      Name: amazflow-cognito
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /health'
      Target: !Sub integrations/${ApiIntegration}
  MeRoute:
