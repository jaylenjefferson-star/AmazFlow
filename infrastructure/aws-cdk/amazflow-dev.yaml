          // time it was durably saved (or 0 for a brand-new run) -- callers capture this right
          // after loading the run, before pushing any new entries, and pass it through advance().
          const saveRunWithAudit=async(run,auditStartIdx)=>{
            const newEntries=run.audit.slice(auditStartIdx||0);
            const items=[{Put:{TableName:table,Item:{pk:{S:`TENANT#${run.tenantId}`},sk:{S:`RUN#${run.id}`},tenantId:{S:run.tenantId},document:{S:JSON.stringify(run)},updatedAt:{S:now()}}}}];
            // A transaction accepts at most 100 items. This used to slice(0,90) and drop the
            // rest with no error, leaving the queryable AUDIT# trail permanently out of step
            // with the run document's own audit array -- and the queryable one is what the
            // evidence tooling reads. Chunk instead of truncating.
            const auditItem=(entry,i)=>({Put:{TableName:table,Item:{pk:{S:`TENANT#${run.tenantId}`},sk:{S:`AUDIT#${run.id}#${String((auditStartIdx||0)+i).padStart(6,'0')}`},tenantId:{S:run.tenantId},document:{S:JSON.stringify({...entry,runId:run.id})},updatedAt:{S:now()}}}});
            const FIRST_BATCH=99;
            newEntries.slice(0,FIRST_BATCH).forEach((entry,i)=>items.push(auditItem(entry,i)));
            await db.send(new TransactWriteItemsCommand({TransactItems:items}));
            for(let offset=FIRST_BATCH;offset<newEntries.length;offset+=100){
              await db.send(new TransactWriteItemsCommand({TransactItems:newEntries.slice(offset,offset+100).map((entry,i)=>auditItem(entry,offset+i))}));
            }
          };
          // The one Gateway tool the Executor is allowed to call in this vertical slice. Auth is
          // the execution grant, not a JWT or agent token -- identity/scope comes entirely from
          // the verified grant payload, never from anything the caller (Gateway/model) claims in
          // the body. Deliberately non-destructive: it appends progress to the run's own audit
          // trail rather than advancing run state, which stays owned by the engine's advance().
          const recordStepResult=async(grantToken,body)=>{
            const stepId=String(body.stepId||'');
            const status=['IN_PROGRESS','SUCCEEDED','FAILED'].includes(body.status)?body.status:null;
            if(!stepId||!status) throw {status:400,message:'stepId and a valid status (IN_PROGRESS, SUCCEEDED, or FAILED) are required'};
            const payload=await verifyExecutionGrant(grantToken,{stepId,tool:'record_step_result'});
            const allRuns=await scanType('RUN#',{role:'SUPER_ADMIN'});
            const run=allRuns.find(r=>r.id===payload.runId);
            if(!run) throw {status:404,message:'Run not found for this execution grant'};
            if(run.tenantId!==payload.tenantId||run.workflowId!==payload.workflowId||run.workflowVersion!==payload.workflowVersion) throw {status:409,message:'Run no longer matches the execution grant'};
            const note=typeof body.note==='string'?body.note.slice(0,2000):undefined;
            const auditStartIdx=run.audit.length;
            run.audit.push({id:`aud_${run.audit.length+1}`,at:now(),type:'EXECUTOR_PROGRESS',stepId,message:`AmazFlow Executor reported ${status} for ${stepId}`,details:{status,note,grantId:payload.grantId}});
            run.updatedAt=now();
            await saveRunWithAudit(run,auditStartIdx);
            return {ok:true,runId:run.id,stepId,status,recordedAt:now()};
          };
          // Runs snapshot the workflow version they started with (workflowVersion) so that a
          // resumed run (after an approval, agent result, or confirmation) keeps executing the
          // exact version it began on, even if a SUPER_ADMIN has since edited and republished the
          // workflow. Falls back to the current WORKFLOW# doc for runs created before version
          // history existed.
          const getWorkflowVersion=async(tenantId,workflowId,version)=>{
            if(version){
              const paddedV=String(version).padStart(6,'0');
              const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:`TENANT#${tenantId}`},sk:{S:`WORKFLOWVERSION#${workflowId}_v${paddedV}`}}}));
              if(out.Item&&out.Item.document?.S) return parse(out.Item);
            }
            const out=await db.send(new GetItemCommand({TableName:table,Key:{pk:{S:`TENANT#${tenantId}`},sk:{S:`WORKFLOW#${workflowId}`}}}));
            return out.Item&&out.Item.document?.S?parse(out.Item):null;
          };
          const BROWSER_ACTIONS=['NAVIGATE','READ_TEXT','CLICK','TYPE','SELECT','CHECK','SCROLL_TO','WAIT_FOR','VERIFY_TEXT','CAPTURE_EVIDENCE','SET_EMPLOYEE_STATUS'];
          // Deliberately narrow: enough to drive an approved desktop procedure, with no shell,
          // no arbitrary code, no filesystem access and no credential surface.
          const DESKTOP_ACTIONS=['desktop.open_app','desktop.focus_window','desktop.click','desktop.type_text','desktop.keypress','desktop.wait_for','desktop.verify_text','desktop.capture_evidence'];
          const ALLOWED_AGENT_OPS=new Set([...BROWSER_ACTIONS,...DESKTOP_ACTIONS]);
          const executionTargetFor=step=>step.executionTarget||(step.provider==='desktop'?'desktop_agent':'browser_extension');
          // What the grant pins the action to. For a browser step that is the origin it may act on;
          // for a desktop step it is the application. Either way the agent is refused if it tries to
          // act somewhere the server did not name.
          const destinationFor=(target,input)=>{
            if(target==='desktop_agent') return typeof input.app==='string'?input.app:(typeof input.window==='string'?input.window:null);
            if(typeof input.url==='string'){ try{ return new URL(input.url).origin; }catch{ return null; } }
            return null;
          };
          const advance=async(workflow,run,auditStartIdx)=>{
            const settings=await getSettings();
            const audit=(type,message,stepId,details)=>run.audit.push({id:`aud_${run.audit.length+1}`,at:now(),type,message,stepId,details});
            let next=run.currentStepId;
            for(let guard=0;guard<30&&next;guard++){
              const step=workflow.steps.find(s=>s.id===next);
              if(!step) throw new Error(`Missing step ${next}`);
              // Action steps default to NOT requiring a separate confirmation gate, so existing
              // workflows keep behaving exactly as before -- a workflow author opts a specific
              // action step into the gate with requiresConfirmation:true.
              if(step.type==='action'&&step.requiresConfirmation===true&&!(run.confirmedStepIds||[]).includes(step.id)){
                run.status='AWAITING_CONFIRMATION'; run.currentStepId=step.id;
                const confirmation={id:`conf_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,tenantId:run.tenantId,kind:'ACTION_GATE',runId:run.id,stepId:step.id,summary:{provider:step.provider,operation:step.operation,name:step.name},status:'PENDING',createdAt:now(),expiresAt:new Date(Date.now()+settings.confirmationExpiryMs).toISOString()};
                await save('CONFIRMATION',confirmation);
                run.pendingConfirmationId=confirmation.id;
                audit('CONFIRMATION_REQUIRED',`Confirm before: ${step.name}`,step.id,{confirmationId:confirmation.id});
                break;
              }
              audit('STEP_STARTED',step.name,step.id);
              if(step.type==='ai'){
                // Model output is untrusted workflow input. Invalid output and provider failures
                // fail closed but still persist a useful run and audit trail for the customer.
                try{
                  const out=await ai(step,{input:run.context.input,...run.context.values});
                  run.context.values[step.outputKey]=out.result;
                  audit('AI_COMPLETED','Amazon Bedrock returned a bounded result',step.id,{model:process.env.BEDROCK_MODEL_ID,usage:out.usage});
                  next=step.next;
                }catch(err){
                  const message=err&&err.message?err.message:String(err);
                  const allowlistRejected=/outside.*allowlist/i.test(message);
                  const canRouteToReview=allowlistRejected&&Array.isArray(step.allowedValues)&&step.allowedValues.map(String).includes('REVIEW');
                  if(canRouteToReview){
                    run.context.values[step.outputKey]={value:'REVIEW',confidence:0};
                    audit('AI_ALLOWLIST_REJECTED',`AmazFlow's AI returned a value outside what "${step.name}" allows -- routed to human review and no action was taken`,step.id,{operation:step.operation,fallback:'REVIEW'});
                    next=step.next;
                    continue;
