            return publicBrowserConnection(connection);
          };
          // ---------- Support tickets ----------
          // Minimal but genuinely durable: every ticket is a real DynamoDB record any role can
          // create, SUPER_ADMIN can triage across tenants, and CLIENT_ADMIN/FRONTLINE can see
          // within the rules the rest of this file already applies to tenant-scoped data.
          const TICKET_STATUSES=['open','in_progress','resolved','closed'];
          const createTicket=async(a,body)=>{
            const subject=String(body.subject||'').trim().slice(0,200);
            const message=String(body.message||'').trim().slice(0,4000);
            if(!subject||!message) throw {status:400,message:'A subject and message are required'};
            const ticket={id:`ticket_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,tenantId:a.tenantId,createdBy:a.userId,subject,message,category:String(body.category||'general').slice(0,40),priority:['low','normal','high','urgent'].includes(body.priority)?body.priority:'normal',runId:body.runId?String(body.runId).slice(0,120):undefined,workflowId:body.workflowId?String(body.workflowId).slice(0,120):undefined,status:'open',notes:[],createdAt:now(),updatedAt:now()};
