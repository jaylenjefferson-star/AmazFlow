  # Browser connections, ported alongside the handler half in Phase 0b so both control-plane
  # copies expose the same route set. A route present in the Lambda but absent here is
  # unreachable, which is a quieter version of the same drift the port exists to close.
  BrowserConnectionsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /connections/browser'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
  BrowserConnectionsPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /connections/browser'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
