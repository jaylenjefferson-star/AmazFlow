      AuthorizerId: !Ref JwtAuthorizer
  # No AuthorizationType (public at the gateway, like /health and POST /leads) -- the
  # extension has no Cognito session. These four routes validate their own bearer token
  # inside the Lambda via agentAuth()/exchangeAgentCode(), never a Cognito JWT.
  AgentAuthorizationExchangePostRoute:
