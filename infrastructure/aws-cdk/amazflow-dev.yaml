  # ---------------------------------------------------------------- Phase 4 (tasks 11.x, 12.x) ----
  # A route that exists in the handler but not here is unreachable from a browser -- exactly the
  # defect PUT /organizations/{slug} shipped with for months. Generated from the served route set by
  # .phase4/add-gateway-routes.cjs, so the two can only disagree if a generation step is skipped.
  #
  # GET /invitations/{token} carries NO authorizer, deliberately: the invitee has no account yet, so
  # requiring a session would make the invitation unopenable by the only person it is for. It is
  # rate-limited in the handler and returns exactly two fields. Acceptance, by contrast, keeps the JWT
  # authorizer -- the caller must be signed in as the invited address.
  MeProfileGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /me/profile'
      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
