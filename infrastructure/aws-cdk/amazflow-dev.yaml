      Target: !Sub integrations/${ApiIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # Organization profile and settings. GET is readable by a customer admin for their own
  # organization; PUT is SUPER_ADMIN only because status and plan are commercial levers. The
  # handler enforces both, these are only the wiring.
  OrganizationGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
