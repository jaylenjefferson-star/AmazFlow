        # Task 9.10 / requirement 1.8-1.10. The three surfaces plus the apex's `www` alias, and
        # nothing else. This is the gateway's half; the handler's half is the per-origin echo in
        # `reply()`, which sends back exactly one origin from the same list and omits the header
        # entirely for anything else. Both halves are needed: the gateway answers the preflight, the
        # handler answers the actual request, and `*` from either one is the permissive header
        # requirement 1.8 exists to remove.
        #
        # The legacy paths live under https://amazflow.com, which is already the first entry, so
        # `/app` and `/console` keep working through the deprecation window (requirement 1.11).
        AllowOrigins:
          - 'https://amazflow.com'
          - 'https://www.amazflow.com'
          - 'https://app.amazflow.com'
          - 'https://admin.amazflow.com'
        # Aligned with the methods the declared routes actually use. This list said
        # [GET, POST, OPTIONS] while PUT /organizations/{slug} already existed, so that route was
        # unreachable from a browser -- the preflight was refused before the request was made.
        # DELETE is needed by the browser-connection route ported in Phase 0b. A route that exists
        # but cannot be called is the same class of defect as a route that only exists in one copy.
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type, x-correlation-id]
        ExposeHeaders: [x-correlation-id]

