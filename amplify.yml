version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - corepack enable
            - corepack prepare pnpm@11.26.0 --activate
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - cd apps/web
            - pnpm exec next build
            - test -f out/index.html
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - ../../.pnpm-store/**/*
