<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px system-ui;width:280px;padding:16px;background:#fffaf0;color:#1e211d}
b{font-size:17px}
label{display:block;margin-top:10px;font-weight:600;font-size:11px;color:#74766e}
input{width:100%;box-sizing:border-box;margin-top:4px;padding:7px 8px;border:1px solid #dcd7c9;border-radius:7px;font:12px/1.3 ui-monospace,monospace}
button{margin-top:10px;width:100%;border:1px solid #1e211d;border-radius:8px;background:#ff765c;color:#1e211d;padding:8px;font-weight:700;font-size:12px;cursor:pointer}
button.quiet{background:transparent}
button:disabled{opacity:.55;cursor:default;background:#e2f2e6}
.status{margin-top:6px;font-size:11px;color:#74766e}
.connected{background:#e2f0e5;border:1px solid #dcd7c9;border-radius:8px;padding:10px;margin-top:8px}
.connected b{font-size:13px;display:block}
.connected small{color:#476351}
small{display:block;margin-top:12px;color:#74766e;line-height:1.5}
hr{border:0;border-top:1px solid #ece7d8;margin:14px 0}
</style></head><body>
<b>AmazFlow Agent</b>
<div id="disconnectedView">
  <p class="status">Not connected to AmazFlow.</p>
  <p id="connectError" class="status" style="color:#9f2d20;display:none"></p>
  <button id="connect">Connect to AmazFlow →</button>
  <small>Opens an AmazFlow tab where you sign in normally and authorize this browser as an agent. No token copying.</small>
</div>
<div id="connectedView" style="display:none">
  <div class="connected">
    <b id="agentNameLabel"></b>
    <small id="agentTenantLabel"></small>
  </div>
  <button id="disconnect" class="quiet">Disconnect</button>
  <hr />
  <div id="siteStatus" class="status"></div>
  <button id="enableSite">Enable on this site</button>
</div>
<script src="popup.js"></script>
</body></html>
