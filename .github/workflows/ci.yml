name: CI

# Runs on every push and pull request. Needs no AWS credentials: the control-plane suite
# exercises the deployed template's own inline Lambda source against an in-memory DynamoDB.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The route inventory gates everything else: a route added to either control-plane copy
      # without being recorded in the committed fixture fails here, which is what keeps the
      # isolation, authorization and parity work enumerable rather than best-effort.
      - name: Control-plane route inventory
        run: pnpm --filter @amazflow/aws-cdk test:inventory

      # Preservation guardrails: the execution semantics the restructure must not weaken --
      # the state machine and its resume paths, execution grant binding and single use, single-
      # winner task leases and the sweep, independent verification, capability-aware claiming,
      # heartbeat-derived status and evidence, and the live-run set failing open. These run
      # before the behavioural suites so a regression is reported as a broken guarantee rather
      # than as an unrelated test failure further down.
      - name: Preservation guardrails
        run: pnpm --filter @amazflow/aws-cdk test:guardrails

      # The control plane's behavioural suites: it is the artifact that reaches production.
      # Includes the baseline two-organization isolation audit, which fails on drift from the
      # committed baseline in either direction.
      - name: Control plane (critical path, onboarding, org settings, isolation baseline)
        run: pnpm --filter @amazflow/aws-cdk test:behaviour

      # Parity last: these catch the canonical source and the deployed template drifting apart.
      - name: Control-plane parity (source and provider)
        run: pnpm --filter @amazflow/aws-cdk test:parity

      - name: Engine and schema
        run: |
          pnpm --filter @amazflow/engine test
          pnpm --filter @amazflow/control-plane test

      # Both agent contract suites assert against built output, so they need a build first.
      - name: Chrome extension contract
        run: |
          pnpm --filter @amazflow/browser-agent build
          pnpm --filter @amazflow/browser-agent test

      - name: Desktop agent contract
        run: |
          pnpm --filter @amazflow/desktop-agent build
          pnpm --filter @amazflow/desktop-agent test

      - name: Typecheck the web app
        run: pnpm --filter @amazflow/web typecheck

      - name: Web app builds as a static export
        run: |
          pnpm --filter @amazflow/web build
          test -f apps/web/out/index.html

  shipped-extension-is-current:
    name: Shipped extension zip matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The extension is served to customers as a committed zip, so a source change that does
      # not rebuild it ships nothing. That has happened before. Compare the committed zip's
      # contents against a fresh build so it cannot happen silently again.
      - name: Rebuild and compare
        run: |
          mkdir -p /tmp/shipped && cd /tmp/shipped
          unzip -qo "$GITHUB_WORKSPACE/apps/web/public/downloads/amazflow-agent.zip"
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @amazflow/browser-agent build
          if ! diff -r --brief apps/browser-agent/dist /tmp/shipped; then
            echo
            echo "The committed extension zip does not match apps/browser-agent/dist."
            echo "Customers would download a stale extension without this fix."
            echo "Run: pnpm --filter @amazflow/browser-agent release"
            exit 1
          fi
          echo "Shipped zip matches source."
