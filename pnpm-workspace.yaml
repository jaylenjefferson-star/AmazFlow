packages:
  - apps/*
  - services/*
  - packages/*
  - infrastructure/*
allowBuilds:
  # Electron's postinstall downloads the platform binary the desktop agent is built and run
  # against, so it has to be permitted. This was left as an unfilled placeholder string,
  # which pnpm cannot read as a boolean -- it skipped the build and then failed any
  # `--frozen-lockfile` install with ERR_PNPM_IGNORED_BUILDS.
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-bedrock-agentcore@3.1128.0'
  - '@aws-sdk/client-cognito-identity-provider@3.1128.0'
  - '@aws-sdk/client-dynamodb@3.1128.0'
  - '@aws-sdk/client-sesv2@3.1128.0'
  - '@aws-sdk/client-bedrock-agentcore-control@3.1128.0'
  - '@aws-sdk/client-bedrock-runtime@3.1128.0'
  - '@aws-sdk/token-providers@3.1128.0'
verifyDepsBeforeRun: false
